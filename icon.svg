<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.55" stop-color="#7d8bfa"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2a5e" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#gloss)"/>

  <!-- progress / cadence ring -->
  <circle cx="256" cy="262" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="30"/>
  <path d="M256 112
           A150 150 0 1 1 149 175"
        fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="30" stroke-linecap="round"/>
  <circle cx="256" cy="112" r="16" fill="#ffffff"/>

  <!-- sprout: stem + two leaves -->
  <g filter="url(#soft)">
    <path d="M256 330 C256 300 256 270 256 236" fill="none" stroke="url(#leaf)" stroke-width="22" stroke-linecap="round"/>
    <path d="M256 262 C232 250 205 256 190 280 C216 292 244 288 256 262 Z" fill="url(#leaf)"/>
    <path d="M256 244 C280 230 308 236 324 262 C297 274 268 270 256 244 Z" fill="url(#leaf)"/>
    <circle cx="256" cy="236" r="13" fill="#ffffff"/>
  </g>
</svg>
