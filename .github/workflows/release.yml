name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag for the release (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package downloadable app
        run: |
          mkdir -p dist
          # Single self-contained file — download and open in any browser, fully offline.
          cp index.html "dist/cadence.html"
          # Full PWA bundle (html + manifest + service worker + icon) for self-hosting / installing.
          zip -j "dist/cadence-pwa.zip" index.html manifest.webmanifest sw.js icon.svg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cadence ${{ steps.tag.outputs.tag }}
          body: |
            **Cadence** — a free, offline study time & habit organizer with a Focus Garden, voice control, and real-time reminders. No AI, no backend, no accounts, no tracking — your data stays in your browser.

            ### Download & run
            - **`cadence.html`** — the entire app in one file. Download it and open it in any browser (phone or computer). It works completely offline. On a phone you can also open it and choose **"Add to Home screen"** to use it like an installed app.
            - **`cadence-pwa.zip`** — all four files (HTML + web manifest + service worker + icon) if you'd rather self-host it as a full installable PWA.

            ### Highlights
            - Time-based habit tracking with live timer, streaks, and analytics
            - **Focus Garden** — plant a session and grow it by focusing; collect species with Sunlight
            - Voice & natural-language commands; real-time reminders; weekly schedule planner
          files: |
            dist/cadence.html
            dist/cadence-pwa.zip
