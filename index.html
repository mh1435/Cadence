<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Last Pact</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a0f; overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace; color: #e8e8e8;
  }
  #gameContainer {
    position: relative; width: 100%; height: 100%;
    touch-action: none;
  }
  #glCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #07070d;
  }
  #gameCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: transparent;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; background: radial-gradient(ellipse at center, rgba(18,10,24,0.88) 0%, rgba(0,0,0,0.93) 100%);
    text-align: center;
  }
  .overlay.hidden { display: none; }
  #menuScreen { background: radial-gradient(ellipse at center, rgba(14,10,20,0.45) 0%, rgba(0,0,0,0.78) 100%); }

  /* these screens show a 3D figure behind the panel — keep them translucent */
  #envoyScreen, #finalBossScreen, #choiceScreen {
    background: radial-gradient(ellipse at center, rgba(10,6,14,0.30) 0%, rgba(0,0,0,0.70) 100%);
    justify-content: flex-start; padding-top: 34px;
  }
  #envoyScreen .panel, #finalBossScreen .panel, #choiceScreen .panel {
    background: rgba(6,4,12,0.66);
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 24px rgba(139,0,0,0.75); }
    50% { text-shadow: 0 0 42px rgba(139,0,0,1), 0 0 78px rgba(139,0,0,0.35); }
  }
  @keyframes panelFadeIn {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1.title { animation: none; }
    .panel { animation: none; }
  }

  h1.title {
    font-size: 56px; color: #8b0000; letter-spacing: 10px;
    margin-bottom: 6px; text-shadow: 0 0 24px rgba(139,0,0,0.8);
    animation: titlePulse 3.6s ease-in-out infinite;
  }
  .subtitle { color: #c0a0ff; margin-bottom: 40px; letter-spacing: 3px; font-size: 14px; }

  #bootError {
    display: none; color: #ff7766; font-size: 13px; margin-bottom: 18px;
    max-width: 420px; line-height: 1.5;
  }

  button {
    font-family: 'Courier New', monospace; background: transparent;
    border: 1px solid #c0a0ff; color: #e8e8e8; padding: 10px 22px;
    font-size: 15px; cursor: pointer; margin: 6px; letter-spacing: 1px;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
  }
  button:hover:not(:disabled) { background: #1a0a2e; box-shadow: 0 0 14px rgba(192,160,255,0.3); }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { border-color: #333; color: #444; cursor: not-allowed; }

  .fightBtn { border-color: #8b0000; color: #ff4444; }
  .fightBtn:hover:not(:disabled) { box-shadow: 0 0 14px rgba(255,68,68,0.3); }
  .spareBtn { border-color: #006400; color: #44ff44; }
  .spareBtn:hover:not(:disabled) { box-shadow: 0 0 14px rgba(68,255,68,0.3); }

  .panel {
    max-width: 620px; padding: 30px; width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    position: relative;
    animation: panelFadeIn 0.4s ease-out;
  }
  /* thin, unobtrusive scrollbar for panels that overflow */
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: #3a2a5a; border-radius: 4px; }

  #dayScreen.overlay { align-items: flex-start; padding: 2vh 0; }
  #dayScreen .panel { max-height: 96vh; }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 18px; height: 18px;
    border: 1px solid rgba(192,160,255,0.55);
  }
  .panel::before { top: 4px; left: 4px; border-right: none; border-bottom: none; }
  .panel::after { bottom: 4px; right: 4px; border-left: none; border-top: none; }
  .enemyName, .envoyName { font-size: 30px; color: #9933cc; margin-bottom: 14px; letter-spacing: 2px; }
  .enemyDialogue, .envoyDeal { font-size: 15px; color: #999; font-style: italic; margin-bottom: 10px; }
  .struckText { color: #661111; margin-bottom: 14px; letter-spacing: 1px; }
  .enduredTextSmall { color: #5a4a7a; margin-bottom: 14px; letter-spacing: 1px; }
  .choiceButtons { margin-top: 18px; }

  .dayHeader { color: #c0a0ff; font-size: 22px; margin-bottom: 16px; letter-spacing: 1px; }
  .hpBarOuter { width: 100%; height: 18px; background: #1a0a0a; border: 1px solid #8b0000; margin-bottom: 6px; }
  .hpBarInner {
    height: 100%; background: linear-gradient(90deg,#8b0000,#ff4444);
    position: relative; overflow: hidden; transition: width 0.4s ease;
  }
  .hpBarInner::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
  }
  .hpText { font-size: 13px; color: #ccc; margin-bottom: 14px; }
  .essenceLine { color: #ffd700; margin-bottom: 14px; font-size: 14px; }
  .alliesList { text-align: left; margin: 0 auto 16px auto; font-size: 13px; color: #c0a0ff; max-width: 460px; }
  .allyDiamond {
    display: inline-block; width: 9px; height: 9px; background: #c0a0ff;
    transform: rotate(45deg); margin-right: 8px;
  }
  .shopGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px; text-align: left; }
  .shopItem { border: 1px solid #2a2a3a; padding: 5px 7px; font-size: 10px; line-height: 1.35; }
  .shopItem strong { color: #e8e8e8; font-size: 11px; }
  .shopItem button { width: 100%; margin: 4px 0 0 0; font-size: 11px; padding: 3px; }
  .equippedItem { border-color: #d9a72b; }
  #dayScreen .dayHeader { font-size: 18px; margin-bottom: 10px; }
  #dayScreen .hpBarOuter { height: 14px; margin-bottom: 4px; }
  #dayScreen .hpText, #dayScreen .essenceLine { margin-bottom: 8px; font-size: 12px; }
  #dayScreen .alliesList { margin-bottom: 10px; font-size: 12px; }
  #dayScreen .sectionLabel { margin-bottom: 4px; padding-bottom: 2px; }
  #dayScreen .beginNightBtn { margin-top: 2px; }
  .sectionLabel {
    color: #8878a8; font-size: 11px; letter-spacing: 3px;
    text-align: left; margin-bottom: 6px;
    border-bottom: 1px solid #2a2a3a; padding-bottom: 3px;
  }
  .beginNightBtn { border-color: #8b0000; color: #ff8888; font-size: 17px; margin-top: 4px; }

  #gameoverScreen .title, #victoryScreen .title { font-size: 42px; letter-spacing: 3px; }
  #gameoverScreen .title { color: #8b0000; }
  #victoryScreen .title { color: #c0a0ff; }
  .endStats { color: #888; font-size: 13px; margin: 16px 0; }
  .endLine { color: #ccc; font-size: 16px; margin-bottom: 20px; font-style: italic; }

  #gameCanvas { touch-action: none; }

  /* ===== Touch controls (phones/tablets only) ===== */
  #touchControls { display: none; }
  body.touch-active #touchControls.show { display: block; }

  #touchControls button {
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    padding: 0;
    margin: 0;
  }

  #dpad {
    position: fixed;
    left: max(18px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 148px; height: 148px;
    z-index: 20;
  }
  .dpadBtn {
    position: absolute;
    width: 50px; height: 50px;
    border: 1px solid #c0a0ff;
    background: rgba(10,10,15,0.55);
    color: #c0a0ff;
    font-size: 18px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .dpadBtn:active { background: #2a1a4a; }
  .dpadBtn.up    { left: 49px; top: 0; }
  .dpadBtn.down  { left: 49px; top: 98px; }
  .dpadBtn.left  { left: 0;   top: 49px; }
  .dpadBtn.right { left: 98px; top: 49px; }

  #attackBtn {
    position: fixed;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(28px, env(safe-area-inset-bottom));
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 2px solid #8b0000;
    background: rgba(30,5,5,0.55);
    color: #ff6666;
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 20;
  }
  #attackBtn:active { background: #5a1010; }

  /* hard landscape lock — the game pauses behind this in portrait */
  #portraitBlock {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: #0a0a0f;
    color: #c0a0ff;
    text-align: center;
    padding: 24px;
    letter-spacing: 1px;
  }
  body.portrait #portraitBlock {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  body.portrait #touchControls { display: none !important; }
  #portraitBlock .big { font-size: 46px; margin-bottom: 18px; animation: titlePulse 3.6s ease-in-out infinite; }
  #portraitBlock .msg { font-size: 15px; line-height: 1.7; color: #e8e8e8; }

  @media (pointer: coarse) {
    button { padding: 13px 24px; font-size: 16px; }
    .shopItem button { padding: 8px; font-size: 13px; }
  }

  /* always-reachable controls that float above the scrolling panel */
  #skipShopBtn {
    display: none;
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 40;
    border-color: #8b0000; color: #ff8888;
    font-size: 12px; padding: 8px 14px; margin: 0;
    background: rgba(10,6,10,0.75);
  }
  body.state-DAY #skipShopBtn { display: block; }

  #fullscreenBtn {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    z-index: 40;
    font-size: 11px; padding: 7px 12px; margin: 0;
    background: rgba(10,6,10,0.6);
    opacity: 0.8;
  }
  #fullscreenBtn:hover { opacity: 1; }
  body.is-fullscreen #fullscreenBtn { display: none; }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="glCanvas" width="800" height="600"></canvas>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen">[ ⛶ FULLSCREEN ]</button>
  <button id="skipShopBtn" onclick="beginNextNight()">[ SKIP ▸ ]</button>

  <div id="menuScreen" class="overlay">
    <div class="panel">
      <h1 class="title">LAST PACT</h1>
      <div class="subtitle">SURVIVE 99 NIGHTS</div>
      <div id="bootError">Couldn't load the 3D engine. Check your internet connection and reload the page.</div>
      <button onclick="startGame()">[ START ]</button>
    </div>
  </div>

  <div id="choiceScreen" class="overlay hidden"></div>
  <div id="envoyScreen" class="overlay hidden"></div>
  <div id="dayScreen" class="overlay hidden"></div>
  <div id="finalBossScreen" class="overlay hidden"></div>

  <div id="gameoverScreen" class="overlay hidden">
    <div class="panel">
      <div class="title">YOU DIED</div>
      <div class="endLine" id="gameoverText"></div>
      <div class="endStats" id="gameoverStats"></div>
      <button onclick="location.reload()">[ PLAY AGAIN ]</button>
    </div>
  </div>

  <div id="victoryScreen" class="overlay hidden">
    <div class="panel">
      <div class="title">YOU SURVIVED</div>
      <div class="endLine">Night 99 is over. The pact is yours to keep.</div>
      <div class="endStats" id="victoryStats"></div>
      <button onclick="location.reload()">[ PLAY AGAIN ]</button>
    </div>
  </div>
</div>

<div id="portraitBlock">
  <div class="big">⟳</div>
  <div class="msg">Turn your device sideways.<br>LAST PACT plays in landscape only.</div>
</div>

<div id="touchControls">
  <div id="dpad">
    <button class="dpadBtn up" data-key="ArrowUp">▲</button>
    <button class="dpadBtn down" data-key="ArrowDown">▼</button>
    <button class="dpadBtn left" data-key="ArrowLeft">◀</button>
    <button class="dpadBtn right" data-key="ArrowRight">▶</button>
  </div>
  <button id="attackBtn">ATTACK</button>
</div>

<script>
// If the module below never boots (offline, blocked CDN, no WebGL), tell the player.
window.__engineWatchdog = setTimeout(function () {
  document.getElementById('bootError').style.display = 'block';
}, 8000);
window.startGame = function () {}; // replaced once the engine boots
</script>
<script type="module">
'use strict';
import * as THREE from 'three';

// ===================== CANVAS / VIEWPORT =====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const glCanvas = document.getElementById('glCanvas');
const gameContainer = document.getElementById('gameContainer');

// live viewport size — the game fills whatever screen it's on
let VW = 800, VH = 600, isPortrait = false;
gameContainer.addEventListener('click', () => window.focus());

// ===================== GRID HELPERS =====================
const GRID_COLS = 10;
const GRID_ROWS = 12;
const BASE_GX = 5;
const BASE_GY = 11;

// grid cell -> world position. x spans the island's width, z runs
// north (enemy spawn, -z) to south (the base, +z). y is up.
function worldPos(gx, gy, h) {
  return new THREE.Vector3(gx - 4.5, h || 0, gy - 5.5);
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const DODGE_BOX = { x: 200, y: 150, w: 400, h: 300 };

// ===================== SCHEDULES =====================
const specialEnemySchedule = {
  3:  { name: "Ashgrip",   dialogue: "You should have run when you had the chance.",        pattern: "cross",   spareBonus: { type: "hp", value: 5 } },
  6:  { name: "Vel",       dialogue: "I don't want to do this either.",                     pattern: "spiral",  spareBonus: { type: "essence", value: 15 } },
  9:  { name: "Thornback", dialogue: "Pain is just the world being honest.",                pattern: "burst",   spareBonus: { type: "ally", allyName: "Thornback", allyBonus: { autoResolvePower: 5 } } },
  15: { name: "Mireya",    dialogue: "They told me you were dangerous.",                    pattern: "wave",    spareBonus: { type: "ally", allyName: "Mireya", allyBonus: { dodgeSpeed: 1 } } },
  20: { name: "Dusk",      dialogue: "Every night I come back. Every night you're still here.", pattern: "cross", spareBonus: { type: "hp", value: 15 } },
  28: { name: "Ashgrip",   dialogue: "Still alive? Impressive. Or stupid.",                 pattern: "spiral",  spareBonus: { type: "essence", value: 25 } },
  35: { name: "Vel",       dialogue: "I remember you. You let me go.",                      pattern: "burst",   spareBonus: { type: "ally", allyName: "Vel", allyBonus: { dodgeSpeed: 1.5 } } },
  45: { name: "Thornback", dialogue: "Something bigger is coming. You feel it too.",        pattern: "wave",    spareBonus: { type: "hp", value: 20 } },
  55: { name: "Mireya",    dialogue: "The Envoys are losing patience with you.",            pattern: "chaos",   spareBonus: { type: "ally", allyName: "Mireya", allyBonus: { autoResolvePower: 8 } } },
  65: { name: "Dusk",      dialogue: "Night 99 is closer than you think.",                  pattern: "chaos",   spareBonus: { type: "essence", value: 40 } },
  75: { name: "Ashgrip",   dialogue: "I'll see you on the last night. One way or another.", pattern: "chaos",   spareBonus: { type: "ally", allyName: "Ashgrip", allyBonus: { autoResolvePower: 12 } } },
  85: { name: "Vel",       dialogue: "Whatever happens on night 99... I'm sorry.",          pattern: "chaos",   spareBonus: { type: "hp", value: 30 } },
};

const envoySchedule = {
  10: { name: "The Pale Voice", pattern: "cross",  deal: "Let me take one of your allies. The next 3 nights will be silent.",       effect: () => { if (player.allies.length) player.allies.shift(); else player.maxHp -= 20; [11, 12, 13].forEach(n => player.nightsWithQuiet.push(n)); } },
  20: { name: "Render",        pattern: "spiral", deal: "Give up 30 essence. Your auto-resolve power doubles permanently.",          effect: () => { player.essence = Math.max(0, player.essence - 30); player.autoResolvePower *= 2; } },
  30: { name: "The Pale Voice", pattern: "burst",  deal: "Your max HP drops by 20. You gain 60 essence.",                           effect: () => { player.maxHp -= 20; player.hp = Math.min(player.hp, player.maxHp); player.essence += 60; } },
  40: { name: "Threshold",     pattern: "wave",   deal: "Stop sparing enemies until night 60. Your dodge speed increases by 2.",    effect: () => { player.dodgeSpeed += 2; spareBanned = true; spareBanLift = 60; } },
  50: { name: "Render",        pattern: "chaos",  deal: "Take 40 damage. The night count jumps ahead by 3.",                       effect: () => { player.hp -= 40; currentNight = Math.min(99, currentNight + 3); } },
  60: { name: "Threshold",     pattern: "chaos",  deal: "Your allies leave. You gain 25 essence per ally and +30 max HP.",         effect: () => { player.essence += player.allies.length * 25; player.maxHp += 30; player.allies = []; } },
  70: { name: "The Pale Voice", pattern: "chaos",  deal: "You forget how to spare. SPARE disabled forever. Basic enemies die instantly.", effect: () => { spareBanned = true; spareBanLift = Infinity; player.autoResolvePower = 9999; } },
  80: { name: "Render",        pattern: "chaos",  deal: "Take 60 damage now. The final night will be easier.",                     effect: () => { player.hp -= 60; renderPact = true; } },
  90: { name: "Threshold",     pattern: "chaos",  deal: "Give all your essence. Receive full HP.",                                 effect: () => { player.essence = 0; player.hp = player.maxHp; } },
};

const upgrades = [
  { key: 'reinforce', label: 'Reinforce', desc: '+20 max HP, heal 20 HP', cost: 20, apply: () => { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); } },
  { key: 'sharpen',   label: 'Sharpen Reflexes', desc: '+0.5 dodge speed', cost: 25, apply: () => { player.dodgeSpeed += 0.5; } },
  { key: 'fortify',   label: 'Fortify', desc: '+5 auto-resolve power', cost: 15, apply: () => { player.autoResolvePower += 5; } },
  { key: 'mend',      label: 'Mend', desc: 'Heal 30 HP', cost: 10, apply: () => { player.hp = Math.min(player.maxHp, player.hp + 30); } },
];

// ===================== ENEMIES / WEAPONS / EVENTS DATA =====================
const ENEMY_TYPES = {
  walker: { hp: 1, speed: 0.02, dmgMult: 1, essence: 2 },
  runner: { hp: 1, speed: 0.045, dmgMult: 1, essence: 3 },
  brute:  { hp: 3, speed: 0.011, dmgMult: 3, essence: 6 },
  wraith: { hp: 1, speed: 0.03, dmgMult: 2, essence: 4, floating: true, zigzag: true },
};

const WEAPONS = {
  sword:   { name: 'Rusted Sword', kind: 'melee', range: 1.7, dmg: 1, cd: 14, desc: 'Trusty. Barely.' },
  cleaver: { name: 'Bone Cleaver', kind: 'melee', range: 2.2, dmg: 2, cd: 24, aoe: true, cost: 40, desc: 'Hits everything in reach.' },
  bow:     { name: "Gravekeeper's Bow", kind: 'ranged', dmg: 1, cd: 20, cost: 60, desc: 'Auto-aims the nearest horror.' },
  storm:   { name: 'Storm Brand', kind: 'melee', range: 1.9, dmg: 2, cd: 16, chain: 2, cost: 100, desc: 'Lightning arcs to nearby foes.' },
};

const NIGHT_EVENTS = {
  bloodMoon: { name: 'BLOOD MOON', tagline: 'The moon bleeds. They hunger. Kills pay double.' },
  fog:       { name: 'DROWNING FOG', tagline: 'A mist crawls up from the sea.' },
  meteors:   { name: 'FALLING SKY', tagline: 'The stars are coming down. Stay clear.' },
  treasure:  { name: 'GIFTS OF THE TIDE', tagline: 'The sea left chests behind. Go touch them.' },
  restless:  { name: 'RESTLESS DEAD', tagline: 'They do not stay down.' },
};
const EVENT_COLORS = { bloodMoon: '#ff6655', fog: '#9db8c9', meteors: '#ffaa55', treasure: '#ffd700', restless: '#b28fdc' };

const WHISPERS = [
  'You hear laughter beneath the waves.',
  'Something counts the nights with you.',
  'The lighthouse has been dark for years.',
  'Your shadow moved before you did.',
  'The gulls left this island long ago.',
  'Salt. Rot. Patience.',
  'It knows your name now.',
];

// ===================== STATE =====================
let gameState = 'MENU';
let currentNight = 1;
let frameCount = 0;
let lastTime = 0;

let player, spareBanned, spareBanLift, renderPact;
let nightEnemies, floatingNumbers;
let nightPhase, nightPhaseTimer, introTimer, isQuietNight;
let specialEnemyThisNight, specialEnemyMemory, currentSpecialEncounter, currentChoiceHit;
let currentEnvoy;
let dodgeCtx, soul, bullets, dodgeState;
let finalBossData;
let defender;
let nightEvent, meteors, meteorTimer, chests, corpses, projectiles;
let whisper, shakeMag, tileMap, nightProps;

function resetState() {
  gameState = 'MENU';
  currentNight = 1;
  frameCount = 0;
  lastTime = 0;

  player = {
    hp: 100, maxHp: 100,
    dodgeSpeed: 4, autoResolvePower: 10,
    effDodgeSpeed: 4, effAutoResolvePower: 10,
    essence: 0,
    allies: [],
    dealsAccepted: 0, dealsRejected: 0,
    enemiesSpared: 0, enemiesFought: 0,
    envoyDealCounts: {},
    nightsWithQuiet: [],
  };

  spareBanned = false;
  spareBanLift = 0;
  renderPact = false;

  nightEnemies = [];
  floatingNumbers = [];
  nightPhase = null;
  nightPhaseTimer = 0;
  introTimer = 0;
  isQuietNight = false;

  specialEnemyThisNight = null;
  specialEnemyMemory = {};
  currentSpecialEncounter = null;
  currentChoiceHit = false;

  currentEnvoy = null;

  dodgeCtx = null;
  soul = { x: 400, y: 300 };
  bullets = [];
  dodgeState = {};

  finalBossData = null;

  defender = { gridX: 5, gridY: 8, attackCooldown: 0, swingT: 0, angle: Math.PI, moving: false, walkPhase: 0 };

  player.weapon = 'sword';

}

// ===================== PROCEDURAL AUDIO =====================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(type, f0, f1, dur, vol, delay) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

function noiseBurst(dur, vol, filterFreq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = filterFreq;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt).connect(gain).connect(audioCtx.destination);
  src.start(t);
}

// --- shared material / geometry caches ---
const matCache = new Map();
function matL(hex, opts) {
  const key = 'L' + hex + JSON.stringify(opts || {});
  if (!matCache.has(key)) {
    matCache.set(key, new THREE.MeshLambertMaterial(Object.assign({ color: hex }, opts || {})));
  }
  return matCache.get(key);
}
function matB(hex, opts) {
  const key = 'B' + hex + JSON.stringify(opts || {});
  if (!matCache.has(key)) {
    matCache.set(key, new THREE.MeshBasicMaterial(Object.assign({ color: hex }, opts || {})));
  }
  return matCache.get(key);
}

const geoCache = new Map();
function cachedGeo(key, make) {
  if (!geoCache.has(key)) geoCache.set(key, make());
  return geoCache.get(key);
}
function geoBox(w, h, d) { return cachedGeo(`box${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)); }
function geoCone(r, h, s) { return cachedGeo(`cone${r},${h},${s}`, () => new THREE.ConeGeometry(r, h, s)); }
function geoCyl(rt, rb, h, s) { return cachedGeo(`cyl${rt},${rb},${h},${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s)); }
function geoSphere(r, s) { return cachedGeo(`sph${r},${s}`, () => new THREE.SphereGeometry(r, s, s)); }
function geoOct(r) { return cachedGeo(`oct${r}`, () => new THREE.OctahedronGeometry(r)); }

function mesh(geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  if (x !== undefined) m.position.set(x, y, z);
  return m;
}
function shadowify(obj, cast, receive) {
  obj.traverse(o => {
    if (o.isMesh) {
      if (cast) o.castShadow = true;
      if (receive) o.receiveShadow = true;
    }
  });
  return obj;
}

function makeHumanoid(spec) {
  const g = new THREE.Group();
  const mBody = matL(spec.body), mHead = matL(spec.head), mLimb = matL(spec.limbs);

  const legGeo = cachedGeo('leg', () => { const gg = new THREE.BoxGeometry(0.14, 0.3, 0.16); gg.translate(0, -0.15, 0); return gg; });
  const legL = mesh(legGeo, mLimb, -0.11, 0.3, 0);
  const legR = mesh(legGeo, mLimb, 0.11, 0.3, 0);
  g.add(legL, legR);

  const body = mesh(geoBox(0.44, 0.42, 0.26), mBody, 0, 0.51, 0);
  g.add(body);

  const armGeo = cachedGeo('arm', () => { const gg = new THREE.BoxGeometry(0.11, 0.34, 0.13); gg.translate(0, -0.14, 0); return gg; });
  const armL = mesh(armGeo, mLimb, -0.28, 0.68, 0);
  const armR = mesh(armGeo, mLimb, 0.28, 0.68, 0);
  g.add(armL, armR);

  const head = mesh(geoBox(0.3, 0.27, 0.27), spec.hood ? matL(spec.hood) : mHead, 0, 0.88, 0);
  g.add(head);
  if (spec.hood) {
    // face peeking out of the hood
    g.add(mesh(geoBox(0.2, 0.17, 0.05), mHead, 0, 0.86, 0.145));
  }

  const eyeMat = spec.glowEyes ? matB(spec.eyes) : matL(spec.eyes);
  g.add(mesh(geoBox(0.05, 0.05, 0.03), eyeMat, -0.07, 0.9, 0.145));
  g.add(mesh(geoBox(0.05, 0.05, 0.03), eyeMat, 0.07, 0.9, 0.145));

  g.scale.setScalar(spec.scale);
  g.userData.anim = { legL, legR, armL, armR };
  return shadowify(g, true, false);
}

function makeGhost(bodyHex, eyeHex, scale, opacity) {
  const g = new THREE.Group();
  const mat = matL(bodyHex, { transparent: true, opacity: opacity === undefined ? 0.82 : opacity });
  const body = mesh(geoCone(0.27, 0.6, 8), mat, 0, 0.5, 0);
  body.rotation.y = Math.PI / 8;
  g.add(body);
  g.add(mesh(geoSphere(0.21, 10), mat, 0, 0.85, 0));
  g.add(mesh(geoBox(0.05, 0.07, 0.03), matB(eyeHex), -0.08, 0.88, 0.17));
  g.add(mesh(geoBox(0.05, 0.07, 0.03), matB(eyeHex), 0.08, 0.88, 0.17));
  const aura = makeGlowSprite(bodyHex, 1.1, 0.28);
  aura.position.y = 0.7;
  g.add(aura);
  g.scale.setScalar(scale || 1);
  return shadowify(g, true, false);
}

  if (type === 'wraith') return makeGhost(0x8a55c8, 0xd9b3ff, 1);
  return makeHumanoid(CHAR_SPECS[type] || CHAR_SPECS.walker);
}

function rebuildIsland() {
  if (islandGroup) scene.remove(islandGroup);
  torchLights.length = 0;
  islandGroup = new THREE.Group();

  const tileGeo = geoBox(0.98, 0.18, 0.98);
  const jrng = mulberry32(currentNight * 31 + 5);
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    for (let gx = 0; gx < GRID_COLS; gx++) {
      const t = (tileMap[gy] && tileMap[gy][gx]) || 'grass1';
      const tile = mesh(tileGeo, matL(TILE_COLORS[t]), gx - 4.5, -0.09 + (jrng() - 0.5) * 0.03, gy - 5.5);
      tile.receiveShadow = true;
      islandGroup.add(tile);
    }
  }

  nightProps.forEach(p => {
    const builder = PROP_BUILDERS[p.kind];
    if (!builder) return;
    const prop = builder();
    prop.position.copy(worldPos(p.gx, p.gy));
    prop.rotation.y = jrng() * Math.PI * 2 * (p.kind === 'torch' ? 0 : 1);
    islandGroup.add(prop);
  });

  baseHouse = makeBaseHouse();
  baseHouse.position.copy(worldPos(BASE_GX, BASE_GY));
  islandGroup.add(baseHouse);

  chests.forEach(c => {
    c._grp = makeChestMesh(c);
    islandGroup.add(c._grp);
  });

  scene.add(islandGroup);
}

function syncMap(map, list, create, update) {
  const live = new Set(list);
  for (const item of list) {
    let g = map.get(item);
    if (!g) {
      g = create(item);
      map.set(item, g);
      worldGroup.add(g);
    }
    update(item, g);
  }
  for (const [item, g] of map) {
    if (!live.has(item)) {
      worldGroup.remove(g);
      map.delete(item);
    }
  }
}

// ===================== FX (particles, slashes, arcs, lights) =====================
const particles = [];
const MAX_PARTICLES = 220;
const slashes = [];
const chainLines = [];
const transientLights = [];

function clearFX() {
  if (typeof fxGroup === 'undefined' || !fxGroup) return;
  for (const p of particles) fxGroup.remove(p.spr);
  particles.length = 0;
  for (const s of slashes) fxGroup.remove(s.mesh);
  slashes.length = 0;
  for (const c of chainLines) fxGroup.remove(c.line);
  chainLines.length = 0;
  for (const l of transientLights) fxGroup.remove(l.light);
  transientLights.length = 0;
}

function spawnSparks(pos, hex, n, opts) {
  opts = opts || {};
  for (let i = 0; i < n; i++) {
    if (particles.length >= MAX_PARTICLES) break;
    const spr = makeGlowSprite(hex, 0.1 + Math.random() * 0.14, 0.9);
    spr.position.copy(pos);
    fxGroup.add(spr);
    particles.push({
      spr,
      vx: (Math.random() - 0.5) * (opts.spread || 0.06),
      vy: 0.03 + Math.random() * 0.05,
      vz: (Math.random() - 0.5) * (opts.spread || 0.06),
      grav: opts.grav === undefined ? 0.004 : opts.grav,
      life: 1,
      decay: opts.decay || 0.045,
    });
  }
}

function spawnEmber(pos, hex) {
  if (particles.length >= MAX_PARTICLES) return;
  const spr = makeGlowSprite(hex, 0.07 + Math.random() * 0.08, 0.45);
  spr.position.copy(pos);
  fxGroup.add(spr);
  particles.push({
    spr,
    vx: (Math.random() - 0.5) * 0.004,
    vy: 0.006 + Math.random() * 0.008,
    vz: (Math.random() - 0.5) * 0.004,
    grav: 0,
    life: 1,
    decay: 0.006,
  });
}

function addFlashLight(pos, hex, intensity, dist) {
  const light = new THREE.PointLight(hex, intensity, dist, 1.8);
  light.position.copy(pos);
  fxGroup.add(light);
  transientLights.push({ light, life: 1, decay: 0.12 });
}

function addSlash(pos, angle, hex, big) {
  const geo = cachedGeo('slash' + (big ? 'B' : 'S'), () => {
    const gg = new THREE.RingGeometry(big ? 0.34 : 0.3, big ? 0.68 : 0.52, 16, 1, -0.85, 1.7);
    gg.rotateX(-Math.PI / 2);
    return gg;
  });
  const mat = new THREE.MeshBasicMaterial({
    color: hex, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  m.position.y += 0.55;
  m.rotation.y = angle - Math.PI / 2;
  fxGroup.add(m);
  slashes.push({ mesh: m, life: 12, maxLife: 12 });
}

function addChainArc(p1, p2) {
  const pts = [];
  for (let s = 0; s <= 4; s++) {
    const f = s / 4;
    const jx = s === 0 || s === 4 ? 0 : (Math.random() - 0.5) * 0.22;
    const jy = s === 0 || s === 4 ? 0 : (Math.random() - 0.5) * 0.22;
    pts.push(new THREE.Vector3(
      p1.x + (p2.x - p1.x) * f + jx,
      p1.y + (p2.y - p1.y) * f + jy,
      p1.z + (p2.z - p1.z) * f + jx
    ));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0xbfe4ff, transparent: true, opacity: 1, blending: THREE.AdditiveBlending });
  const line = new THREE.Line(geo, mat);
  fxGroup.add(line);
  chainLines.push({ line, life: 10 });
}

function addDeathBurst(pos) {
  spawnSparks(pos, 0xff6644, 8, { spread: 0.09 });
  addFlashLight(new THREE.Vector3(pos.x, pos.y + 0.4, pos.z), 0xff5533, 3.5, 3);
}

function updateFX(ndt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.spr.position.x += p.vx * ndt;
    p.spr.position.y += p.vy * ndt;
    p.spr.position.z += p.vz * ndt;
    p.vy -= p.grav * ndt;
    p.life -= p.decay * ndt;
    p.spr.material.opacity = clamp(p.life, 0, 1) * 0.9;
    if (p.life <= 0 || p.spr.position.y < -0.9) {
      fxGroup.remove(p.spr);
      p.spr.material.dispose();
      particles.splice(i, 1);
    }
  }
  for (let i = slashes.length - 1; i >= 0; i--) {
    const s = slashes[i];
    s.life -= ndt;
    s.mesh.material.opacity = clamp(s.life / s.maxLife, 0, 1) * 0.9;
    s.mesh.scale.setScalar(1 + (1 - s.life / s.maxLife) * 0.35);
    if (s.life <= 0) {
      fxGroup.remove(s.mesh);
      s.mesh.material.dispose();
      slashes.splice(i, 1);
    }
  }
  for (let i = chainLines.length - 1; i >= 0; i--) {
    const c = chainLines[i];
    c.life -= ndt;
    c.line.material.opacity = clamp(c.life / 10, 0, 1);
    if (c.life <= 0) {
      fxGroup.remove(c.line);
      c.line.geometry.dispose();
      c.line.material.dispose();
      chainLines.splice(i, 1);
    }
  }
  for (let i = transientLights.length - 1; i >= 0; i--) {
    const l = transientLights[i];
    l.life -= l.decay * ndt;
    l.light.intensity *= Math.pow(0.85, ndt);
    if (l.life <= 0) {
      fxGroup.remove(l.light);
      transientLights.splice(i, 1);
    }
  }
}

  g.add(mesh(geoBox(0.06, 0.14, 0.04), eye, 0.1, 2.03, 0.27));

function makeRenderFigure(scale) {
  const g = new THREE.Group();
  const gold = matL(0xd99a2b, { emissive: 0x664d10 });
  const shards = [
    mesh(geoOct(0.5), gold, 0, 0.6, 0),
    mesh(geoOct(0.34), gold, 0, 1.35, 0),
    mesh(geoOct(0.22), gold, 0, 1.92, 0),

  shards.forEach(s => g.add(s));
  const glow = makeGlowSprite(0xffd27f, 2.2, 0.5);
  glow.position.y = 1.2;
  g.add(glow);
  const light = new THREE.PointLight(0xffd27f, 6, 8, 1.8);
  light.position.y = 1.4;
  g.add(light);
  g.userData.tick = (t) => {
    shards.forEach((s, i) => { s.rotation.y = t * 0.02 * (i % 2 ? -1 : 1); });
    const pulse = 0.6 + Math.sin(t * 0.05) * 0.25;
    glow.material.opacity = 0.35 * pulse + 0.2;
    light.intensity = 4 + pulse * 3;
  };
  g.scale.setScalar(scale || 1);
  return shadowify(g, true, false);
}

function makeLoneWolfFigure() {
  const g = new THREE.Group();
  const blob = mesh(cachedGeo('blob', () => new THREE.IcosahedronGeometry(1.15, 1)), matL(0x0a070f), 0, 1.1, 0);
  blob.scale.y = 0.8;
  g.add(blob);
  const wire = new THREE.Mesh(blob.geometry, new THREE.MeshBasicMaterial({ color: 0x26202e, wireframe: true, transparent: true, opacity: 0.5 }));
  wire.position.copy(blob.position);
  wire.scale.copy(blob.scale).multiplyScalar(1.01);
  g.add(wire);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3c3c });
  const e1 = mesh(geoSphere(0.09, 8), eyeMat, -0.32, 1.25, 0.85);
  const e2 = mesh(geoSphere(0.09, 8), eyeMat, 0.32, 1.25, 0.85);
  g.add(e1, e2);
  const light = new THREE.PointLight(0xff3c3c, 3, 6, 1.8);
  light.position.set(0, 1.4, 1.2);
  g.add(light);
  g.userData.tick = (t) => {
    const blink = Math.sin(t * 0.02) > -0.9 ? 1 : 0.12;
    eyeMat.opacity = blink;
    eyeMat.transparent = true;
    const breathe = 1 + Math.sin(t * 0.03) * 0.04;
    blob.scale.set(breathe, 0.8 * breathe, breathe);
    wire.scale.copy(blob.scale).multiplyScalar(1.01);
  };
  return shadowify(g, true, false);
}

// figureTag examples: 'champion', 'envoy:Render', 'boss:lonewolf', 'boss:envoy:Render', 'boss:betrayal'
function setFigure(tag) {
  if (tag === figureTag) return;
  figureTag = tag;
  if (figureGroup) {
    scene.remove(figureGroup);
    figureGroup = null;
  }
  if (!tag) return;

  let fig = null;
  if (tag === 'champion') {
    fig = makeCharacter('champion');
    fig.scale.multiplyScalar(1.3);
  } else if (tag.startsWith('envoy:')) {
    fig = makeEnvoyFigure(tag.slice(6), 1);
  } else if (tag.startsWith('boss:envoy:')) {
    fig = makeEnvoyFigure(tag.slice(11), 1.35);
  } else if (tag === 'boss:lonewolf') {
    fig = makeLoneWolfFigure();
  } else if (tag === 'boss:betrayal') {
    fig = makeBetrayalFigure();
  }
  if (!fig) return;

  figureGroup = new THREE.Group();
  figureGroup.position.copy(FIGURE_SPOT);
  figureGroup.rotation.y = 0; // faces south, toward the camera
  figureGroup.add(fig);
  const keyLight = new THREE.PointLight(0xc0a0ff, 5, 10, 1.8);
  keyLight.position.set(0, 3, 2.5);
  figureGroup.add(keyLight);
  figureGroup.userData.inner = fig;
  scene.add(figureGroup);
}

// ===================== FULLSCREEN =====================
function requestFS(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fn) return fn.call(el);
  return Promise.reject(new Error('Fullscreen API unavailable'));
}
function exitFS() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (fn) return fn.call(document);
  return Promise.resolve();
}
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function toggleFullscreen() {
  if (isFullscreen()) exitFS().catch(() => {});
  else requestFS(document.documentElement).catch(() => {});
}
['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    document.body.classList.toggle('is-fullscreen', isFullscreen());
    resizeViewport();
  })
);
window.toggleFullscreen = toggleFullscreen;

function startGame() {
  window.focus();

  // best-effort: a fresh user gesture (this click) is required for the
  // Fullscreen API, so try it here rather than forcing a second tap
  requestFS(document.documentElement).catch(() => {});
  resetState();
  setupNight(1);
}

function generateIslandData() {
  const trng = mulberry32(currentNight * 7919 + 13);

  // island tile map: sand ring, dirt path to the base, textured grass inside
  tileMap = [];
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    const row = [];
    for (let gx = 0; gx < GRID_COLS; gx++) {
      let t;
      if (gx === 0 || gx === GRID_COLS - 1 || gy === 0 || gy === GRID_ROWS - 1) t = 'sand';
      else if (gx === 5) t = 'dirt';
      else if (gy >= 10 && gx >= 4 && gx <= 6) t = 'dirt';
      else t = trng() < 0.5 ? 'grass1' : 'grass2';
      row.push(t);
    }
    tileMap.push(row);
  }

  // scenery props scattered off the path, away from the base courtyard
  nightProps = [];
  const propKinds = ['pine', 'pine', 'deadTree', 'rock', 'grave', 'ruin', 'pine', 'rock', 'deadTree'];
  const usedCells = new Set();
  for (let i = 0; i < propKinds.length; i++) {
    let gx, gy, tries = 0;
    do {
      gx = 1 + Math.floor(trng() * (GRID_COLS - 2));
      gy = 1 + Math.floor(trng() * (GRID_ROWS - 3));
      tries++;
    } while (tries < 30 && (gx === 5 || (gy >= 9 && gx >= 3 && gx <= 7) || usedCells.has(gx + ',' + gy)));
    if (tries >= 30) continue;
    usedCells.add(gx + ',' + gy);
    nightProps.push({ gx, gy, kind: propKinds[i] });
  }
  nightProps.push({ gx: 4.55, gy: 10.4, kind: 'torch' });
  nightProps.push({ gx: 5.45, gy: 10.4, kind: 'torch' });
}

function setupNight(n) {
  currentNight = clamp(n, 1, 99);
  if (spareBanned && spareBanLift !== Infinity && currentNight >= spareBanLift) spareBanned = false;

  floatingNumbers = [];
  nightPhase = null;
  nightPhaseTimer = 0;
  introTimer = 0;
  setFigure(null);
  clearFX();

  isQuietNight = player.nightsWithQuiet.includes(currentNight);

  // random night event
  nightEvent = null;
  if (!isQuietNight && currentNight >= 3 && currentNight !== 99 && Math.random() < 0.45) {
    const pool = ['bloodMoon', 'fog', 'meteors', 'treasure', 'restless'];
    nightEvent = pool[Math.floor(Math.random() * pool.length)];
  }

  chests = [];
  if (nightEvent === 'treasure') {
    for (let i = 0; i < 3; i++) chests.push({ gx: 1 + Math.random() * 7, gy: 2 + Math.random() * 7, opened: false });
  }
  meteors = []; meteorTimer = 60;
  corpses = []; projectiles = [];
  whisper = { text: null, t: 0 };
  shakeMag = 0;

  generateIslandData();
  rebuildIsland();

  if (isQuietNight) {
    nightEnemies = [];
  } else {
    let count = 3 + Math.floor(currentNight / 5);
    if (nightEvent === 'bloodMoon') count = Math.ceil(count * 1.5);
    nightEnemies = [];
    for (let i = 0; i < count; i++) {
      let type = 'walker';
      const roll = Math.random();
      if (currentNight >= 12 && roll < 0.15) type = 'wraith';
      else if (currentNight >= 8 && roll < 0.3) type = 'brute';
      else if (currentNight >= 4 && roll < 0.55) type = 'runner';
      const def = ENEMY_TYPES[type];
      const gx = Math.floor(Math.random() * GRID_COLS);
      nightEnemies.push({
        type,
        gridX: gx,
        baseGX: gx,
        gridY: -0.4,
        phase: Math.random() * Math.PI * 2,
        hp: def.hp,
        maxHp: def.hp,
        speed: def.speed * (0.9 + Math.random() * 0.2),
        spawnT: 0,
      });
    }
  }

  specialEnemyThisNight = (currentNight !== 99 && specialEnemySchedule[currentNight]) ? { ...specialEnemySchedule[currentNight] } : null;

  defender.gridX = 5;
  defender.gridY = 8;
  defender.attackCooldown = 0;
  defender.swingT = 0;
  defender.angle = Math.PI;
  defender.moving = false;
  defender.walkPhase = 0;

  sfxNightStart();
  setGameState('NIGHT_INTRO');
}

// ===================== NIGHT UPDATE =====================
function updateNightIntro(dtMs) {
  introTimer += dtMs;
  if (introTimer >= 1500) {
    introTimer = 0;
    nightPhase = isQuietNight ? 'quiet' : 'marching';
    nightPhaseTimer = 0;
    setGameState('NIGHT');
  }
}

function updateNight(ndt) {
  if (player.hp <= 0) { triggerGameOver('The last pact is broken.'); return; }

  if (nightPhase === 'quiet') {
    nightPhaseTimer += ndt;
    if (nightPhaseTimer > 120) afterBasics();
    return;
  }

  if (nightPhase === 'marching') {
    updateDefender(ndt);
    updateProjectiles(ndt);
    updateMeteors(ndt);
    updateChests();
    updateCorpses(ndt);
    updateWhisper(ndt);

    for (let i = nightEnemies.length - 1; i >= 0; i--) {
      const e = nightEnemies[i];
      if (player.effAutoResolvePower >= 9999) {
        nightEnemies.splice(i, 1);
        continue;
      }
      const def = ENEMY_TYPES[e.type] || ENEMY_TYPES.walker;
      e.spawnT = Math.min(1, (e.spawnT || 0) + 0.03 * ndt);
      e.gridY += e.speed * ndt;
      if (def.zigzag) e.gridX = clamp(e.baseGX + Math.sin(e.gridY * 0.9 + e.phase) * 1.3, 0, GRID_COLS - 1);
      if (e.gridY >= GRID_ROWS - 1) {
        const dmg = Math.max(1, 5 - player.effAutoResolvePower) * def.dmgMult;
        player.hp = Math.max(0, player.hp - dmg);
        sfxBaseHit();
        spawnFloatingDamage(dmg);
        shakeMag = Math.max(shakeMag, 4);
        nightEnemies.splice(i, 1);
        if (player.hp <= 0) { triggerGameOver('The last pact is broken.'); return; }
      }
    }
    if (nightEnemies.length === 0 && corpses.length === 0) afterBasics();
    return;
  }

  if (nightPhase === 'specialAnnounce') {
    nightPhaseTimer += ndt;
    if (nightPhaseTimer > 72) beginSpecialDodge();
    return;
  }
}

function afterBasics() {
  if (currentNight === 99) {
    startFinalBossIntro();
  } else if (specialEnemyThisNight) {
    nightPhase = 'specialAnnounce';
    nightPhaseTimer = 0;
    setFigure('champion');
  } else {
    resolveNightEnd();
  }
}

function resolveNightEnd() {
  if (player.hp <= 0) { triggerGameOver('The last pact is broken.'); return; }
  if (currentNight % 10 === 0 && envoySchedule[currentNight]) {
    beginEnvoy();
  } else {
    beginDay();
  }
}

// floating numbers live in world space and get projected onto the overlay
function spawnFloat(gx, gy, h, text, color) {
  floatingNumbers.push({ gx, gy, h, text, color, alpha: 1 });
}

function spawnFloatingDamage(value) {
  spawnFloat(BASE_GX, BASE_GY, 1.6, '-' + Math.round(value), '#ff3333');
}

function updateFloatingNumbers(ndt) {
  for (let i = floatingNumbers.length - 1; i >= 0; i--) {
    const f = floatingNumbers[i];
    f.h += 0.022 * ndt;
    f.alpha -= 0.02 * ndt;
    if (f.alpha <= 0) floatingNumbers.splice(i, 1);
  }
}

// ===================== DEFENDER, WEAPONS & NIGHT SYSTEMS =====================
function gridDist(a, b) {
  const dx = a.gridX - b.gridX, dy = a.gridY - b.gridY;
  return Math.sqrt(dx * dx + dy * dy);
}

function updateDefender(ndt) {
  const spd = 0.16 * ndt;
  // screen-aligned input: up walks toward the far shore, down toward
  // the base, left/right across the island
  let mx = 0, mz = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) mz -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) mz += 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) mx += 1;
  defender.moving = (mx !== 0 || mz !== 0);
  if (defender.moving) {
    const inv = 1 / Math.hypot(mx, mz);
    mx *= inv * spd;
    mz *= inv * spd;
    defender.gridX = clamp(defender.gridX + mx, 0, GRID_COLS - 1);
    defender.gridY = clamp(defender.gridY + mz, 0, GRID_ROWS - 2);
    defender.walkPhase += 0.35 * ndt;
    defender.angle = Math.atan2(mx, mz);
  }

  if (defender.attackCooldown > 0) defender.attackCooldown -= ndt;
  if (defender.swingT > 0) defender.swingT -= ndt;
  if (keys[' '] && defender.attackCooldown <= 0) performAttack();
}

function nearestEnemyTo(gx, gy, maxDist) {
  let best = null, bestD = maxDist;
  for (const e of nightEnemies) {
    const d = Math.sqrt((e.gridX - gx) * (e.gridX - gx) + (e.gridY - gy) * (e.gridY - gy));
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function enemyWorldPos(e, h) {
  return worldPos(e.gridX, e.gridY, h === undefined ? 0.55 : h);
}

function performAttack() {
  const w = WEAPONS[player.weapon] || WEAPONS.sword;
  defender.attackCooldown = w.cd;
  defender.swingT = 12;
  const dPos = worldPos(defender.gridX, defender.gridY);

  if (w.kind === 'ranged') {
    sfxBowShot();
    spawnSparks(new THREE.Vector3(dPos.x, dPos.y + 0.6, dPos.z), 0xd9c9a0, 3, { spread: 0.03 });
    const target = nearestEnemyTo(defender.gridX, defender.gridY, Infinity);
    if (target) {
      projectiles.push({ pos: new THREE.Vector3(dPos.x, dPos.y + 0.6, dPos.z), dest: enemyWorldPos(target), target, speed: 0.3, dmg: w.dmg });
    }
    return;
  }

  sfxSwing();
  addSlash(dPos, defender.angle, w.chain ? 0x9fd4ff : 0xffe9a8, !!w.aoe);
  addFlashLight(new THREE.Vector3(dPos.x, dPos.y + 0.7, dPos.z), w.chain ? 0x9fd4ff : 0xffe9a8, 4, 3.5);
  const inRange = nightEnemies.filter(e => gridDist(e, defender) <= w.range);
  if (!inRange.length) return;

  let targets;
  if (w.aoe) targets = inRange.slice();
  else targets = [inRange.reduce((a, b) => gridDist(a, defender) < gridDist(b, defender) ? a : b)];

  const primary = targets[0];
  let chainTargets = [];
  if (w.chain && primary) {
    chainTargets = nightEnemies.filter(e => e !== primary && !targets.includes(e) && gridDist(e, primary) <= 2.5).slice(0, w.chain);
  }
  targets.forEach(t => damageEnemy(t, w.dmg));
  chainTargets.forEach(e => {
    addChainArc(enemyWorldPos(primary), enemyWorldPos(e));
    damageEnemy(e, 1);
  });
}

function damageEnemy(e, dmg) {
  const idx = nightEnemies.indexOf(e);
  if (idx < 0) return;
  e.hp -= dmg;
  e.hitT = 8;
  spawnSparks(enemyWorldPos(e, 0.6), 0xffcc88, 4);
  if (e.hp > 0) {
    sfxHit();
    e.gridY = Math.max(0, e.gridY - 0.18);
    return;
  }
  sfxKill();
  const def = ENEMY_TYPES[e.type] || ENEMY_TYPES.walker;
  let gain = def.essence;
  if (nightEvent === 'bloodMoon') gain *= 2;
  player.essence += gain;
  spawnFloat(e.gridX, e.gridY, 1.2, '+' + gain, '#ffd700');
  addDeathBurst(enemyWorldPos(e, 0.2));
  if (nightEvent === 'restless' && !e.revived && Math.random() < 0.4) {
    corpses.push({ gx: e.gridX, gy: e.gridY, type: e.type, timer: 140 });
  }
  nightEnemies.splice(idx, 1);
}

function updateProjectiles(ndt) {
  const tmp = new THREE.Vector3();
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.target && nightEnemies.includes(p.target)) {
      p.dest = enemyWorldPos(p.target);
    } else if (!p.dest) {
      projectiles.splice(i, 1);
      continue;
    }
    tmp.copy(p.dest).sub(p.pos);
    const d = tmp.length();
    if (d < 0.28) {
      if (p.target && nightEnemies.includes(p.target)) damageEnemy(p.target, p.dmg);
      else spawnSparks(p.dest, 0x998866, 3);
      projectiles.splice(i, 1);
      continue;
    }
    tmp.normalize().multiplyScalar(Math.min(p.speed * ndt, d));
    p.pos.add(tmp);
    p.dir = tmp.clone().normalize();
  }
}

function updateMeteors(ndt) {
  if (nightEvent !== 'meteors') return;
  meteorTimer -= ndt;
  if (meteorTimer <= 0) {
    meteorTimer = 90 + Math.random() * 70;
    meteors.push({ gx: Math.random() * (GRID_COLS - 1), gy: 0.5 + Math.random() * 9.5, t: 0 });
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.t += ndt;
    if (m.t >= 74) {
      const p = worldPos(m.gx, m.gy, 0.15);
      sfxMeteor();
      spawnSparks(p, 0xff8844, 14, { spread: 0.1 });
      addFlashLight(new THREE.Vector3(p.x, p.y + 0.6, p.z), 0xff8844, 8, 5);
      shakeMag = Math.max(shakeMag, 7);
      for (let j = nightEnemies.length - 1; j >= 0; j--) {
        const e = nightEnemies[j];
        const d = Math.sqrt((e.gridX - m.gx) ** 2 + (e.gridY - m.gy) ** 2);
        if (d <= 1.2) damageEnemy(e, 99);
      }
      const dd = Math.sqrt((defender.gridX - m.gx) ** 2 + (defender.gridY - m.gy) ** 2);
      if (dd <= 1.1) {
        player.hp = Math.max(0, player.hp - 8);
        spawnFloat(defender.gridX, defender.gridY, 1.4, '-8', '#ff3333');
        if (player.hp <= 0) { triggerGameOver('The sky claimed you.'); return; }
      }
      meteors.splice(i, 1);
    }
  }
}

function updateChests() {
  chests.forEach(c => {
    if (c.opened) return;
    const d = Math.sqrt((defender.gridX - c.gx) ** 2 + (defender.gridY - c.gy) ** 2);
    if (d < 0.85) {
      c.opened = true;
      sfxChest();
      const gain = 12 + Math.floor(currentNight / 3);
      player.essence += gain;
      spawnFloat(c.gx, c.gy, 0.9, '+' + gain, '#ffd700');
      spawnSparks(worldPos(c.gx, c.gy, 0.3), 0xffd700, 10);
      if (c._grp) {
        c._grp.userData.lid.rotation.x = -1.7;
        c._grp.userData.glint.visible = false;
      }
    }
  });
}

function updateCorpses(ndt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.timer -= ndt;
    if (c.timer <= 0) {
      const def = ENEMY_TYPES[c.type] || ENEMY_TYPES.walker;
      nightEnemies.push({
        type: c.type, gridX: c.gx, baseGX: c.gx, gridY: c.gy,
        phase: Math.random() * Math.PI * 2,
        hp: 1, maxHp: 1, speed: def.speed, spawnT: 0, revived: true,
      });
      corpses.splice(i, 1);
    }
  }
}

function updateWhisper(ndt) {
  if (!whisper.text && Math.random() < 0.002 * ndt) {
    whisper.text = WHISPERS[Math.floor(Math.random() * WHISPERS.length)];
    whisper.t = 260;
  }
  if (whisper.text) {
    whisper.t -= ndt;
    if (whisper.t <= 0) whisper.text = null;
  }
}

// ===================== SPECIAL ENEMY DODGE =====================
function beginSpecialDodge() {
  const data = specialEnemyThisNight;
  const mem = specialEnemyMemory[data.name] || { spared: false, fought: false };
  let dialogue = data.dialogue;
  let bonusMultiplier = 1;
  let speedMultiplier = 1;
  if (mem.spared) {
    dialogue = "You again. Good.";
    bonusMultiplier = 2;
  } else if (mem.fought) {
    speedMultiplier = 1.2;
  }
  currentSpecialEncounter = { name: data.name, dialogue, spareBonus: data.spareBonus, bonusMultiplier };

  triggerDodge({
    pattern: data.pattern,
    duration: 6,
    hitDamage: 12,
    endOnHit: true,
    speedMultiplier,
    onHit: () => showChoice(true),
    onSurvive: () => showChoice(false),
  });
}

function showChoice(wasHit) {
  currentChoiceHit = wasHit;
  setGameState('CHOICE');
  populateChoiceScreen();
}

function populateChoiceScreen() {
  const el = overlays.CHOICE;
  const data = currentSpecialEncounter;
  const stateLine = currentChoiceHit
    ? '<div class="struckText">You were struck.</div>'
    : '<div class="enduredTextSmall">You endured it.</div>';
  el.innerHTML = `
    <div class="panel">
      <div class="enemyName">${data.name}</div>
      <div class="enemyDialogue">"${data.dialogue}"</div>
      ${stateLine}
      <div class="choiceButtons">
        <button class="fightBtn" onclick="onFight()">[FIGHT]</button>
        <button class="spareBtn" ${spareBanned ? 'disabled' : ''} onclick="onSpare()">[SPARE]</button>
      </div>
    </div>
  `;
}

function onFight() {
  const data = currentSpecialEncounter;
  player.essence += 10 + Math.floor(currentNight / 5);
  player.enemiesFought++;
  specialEnemyMemory[data.name] = specialEnemyMemory[data.name] || { spared: false, fought: false };
  specialEnemyMemory[data.name].fought = true;
  const idx = player.allies.findIndex(a => a.name === data.name);
  if (idx >= 0) player.allies.splice(idx, 1);
  clampPlayer();
  setFigure(null);
  resolveNightEnd();
}

function onSpare() {
  if (spareBanned) return;
  const data = currentSpecialEncounter;
  applySpareBonus(data.spareBonus, data.bonusMultiplier);
  player.enemiesSpared++;
  specialEnemyMemory[data.name] = specialEnemyMemory[data.name] || { spared: false, fought: false };
  specialEnemyMemory[data.name].spared = true;
  clampPlayer();
  setFigure(null);
  resolveNightEnd();
}

function applySpareBonus(bonus, mult) {
  mult = mult || 1;
  if (bonus.type === 'hp') {
    player.hp = Math.min(player.maxHp, player.hp + bonus.value * mult);
  } else if (bonus.type === 'essence') {
    player.essence += bonus.value * mult;
  } else if (bonus.type === 'ally') {
    const existing = player.allies.find(a => a.name === bonus.allyName);
    if (existing) {
      Object.keys(bonus.allyBonus).forEach(k => {
        existing.bonus[k] = (existing.bonus[k] || 0) + bonus.allyBonus[k] * mult;
      });
    } else {
      const scaled = {};
      Object.keys(bonus.allyBonus).forEach(k => scaled[k] = bonus.allyBonus[k] * mult);
      player.allies.push({ name: bonus.allyName, bonus: scaled });
    }
  }
  player.essence = Math.max(0, player.essence);
}

// ===================== ENVOY =====================
function beginEnvoy() {
  currentEnvoy = { ...envoySchedule[currentNight] };
  setFigure('envoy:' + currentEnvoy.name);
  setGameState('ENVOY');
  populateEnvoyScreen();
}

function populateEnvoyScreen() {
  const el = overlays.ENVOY;
  el.innerHTML = `
    <div class="panel">
      <div class="envoyName">${currentEnvoy.name}</div>
      <div class="envoyDeal">${currentEnvoy.deal}</div>
      <div class="choiceButtons">
        <button class="fightBtn" onclick="startEnvoyDodge()">[Dodge to Reject]</button>
        <button class="spareBtn" onclick="acceptEnvoyDeal()">[Accept the Deal]</button>
      </div>
    </div>
  `;
}

function acceptEnvoyDeal() {
  currentEnvoy.effect();
  player.dealsAccepted++;
  player.envoyDealCounts[currentEnvoy.name] = (player.envoyDealCounts[currentEnvoy.name] || 0) + 1;
  afterEnvoyEffect();
}

function startEnvoyDodge() {
  triggerDodge({
    pattern: currentEnvoy.pattern,
    duration: 5,
    hitDamage: 0,
    endOnHit: true,
    speedMultiplier: 1,
    onHit: () => {
      currentEnvoy.effect();
      player.dealsAccepted++;
      player.envoyDealCounts[currentEnvoy.name] = (player.envoyDealCounts[currentEnvoy.name] || 0) + 1;
      afterEnvoyEffect();
    },
    onSurvive: () => {
      player.dealsRejected++;
      beginDay();
    },
  });
}

function afterEnvoyEffect() {
  clampPlayer();
  if (player.hp <= 0) triggerGameOver('The deal cost you everything.');
  else beginDay();
}

// ===================== DAY =====================
function beginDay() {
  recalcAllyBonuses();
  clampPlayer();
  setFigure(null);
  setGameState('DAY');
  populateDayScreen();
}

function recalcAllyBonuses() {
  let dodgeBonus = 0, powerBonus = 0;
  player.allies.forEach(a => {
    dodgeBonus += a.bonus.dodgeSpeed || 0;
    powerBonus += a.bonus.autoResolvePower || 0;
  });
  player.effDodgeSpeed = player.dodgeSpeed + dodgeBonus;
  player.effAutoResolvePower = player.autoResolvePower + powerBonus;
}

function populateDayScreen() {
  const el = overlays.DAY;
  const hpPct = Math.round((player.hp / player.maxHp) * 100);
  const alliesHtml = player.allies.length
    ? player.allies.map(a => {
        const bonusStr = Object.entries(a.bonus).map(([k, v]) => `${k} +${v}`).join(', ');
        return `<div><span class="allyDiamond"></span>${a.name} — ${bonusStr}</div>`;
      }).join('')
    : '<div style="color:#555;">No allies</div>';

  const shopHtml = upgrades.map(u => {
    const afford = player.essence >= u.cost;
    return `<div class="shopItem">
      <strong>${u.label}</strong><br>${u.desc}<br>Cost: ${u.cost} essence
      <button ${afford ? '' : 'disabled'} onclick="buyUpgrade('${u.key}')">Buy</button>
    </div>`;
  }).join('');

  const weaponsHtml = Object.keys(WEAPONS).map(k => {
    const w = WEAPONS[k];
    const owned = player.ownedWeapons.includes(k);
    const equipped = player.weapon === k;
    const cost = w.cost || 0;
    let btn;
    if (equipped) btn = `<button disabled>Equipped</button>`;
    else if (owned) btn = `<button onclick="equipWeapon('${k}')">Equip</button>`;
    else btn = `<button ${player.essence >= cost ? '' : 'disabled'} onclick="buyWeapon('${k}')">Buy · ${cost}</button>`;
    return `<div class="shopItem ${equipped ? 'equippedItem' : ''}">
      <strong>${w.name}</strong><br>${w.desc}
      ${btn}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="panel">
      <div class="dayHeader">Dawn — Night ${currentNight} survived</div>
      <div class="hpBarOuter"><div class="hpBarInner" style="width:${hpPct}%"></div></div>
      <div class="hpText">HP: ${Math.round(player.hp)} / ${player.maxHp}</div>
      <div class="essenceLine">Essence: ${player.essence}</div>
      <div class="alliesList">${alliesHtml}</div>
      <div class="sectionLabel">UPGRADES</div>
      <div class="shopGrid">${shopHtml}</div>
      <div class="sectionLabel">ARMORY</div>
      <div class="shopGrid">${weaponsHtml}</div>
      <button class="beginNightBtn" onclick="beginNextNight()">[Begin Night ${currentNight + 1}]</button>
    </div>
  `;
}

function buyUpgrade(key) {
  const up = upgrades.find(u => u.key === key);
  if (!up || player.essence < up.cost) return;
  player.essence -= up.cost;
  up.apply();
  recalcAllyBonuses();
  clampPlayer();
  populateDayScreen();
}

function buyWeapon(k) {
  const w = WEAPONS[k];
  if (!w || player.ownedWeapons.includes(k) || player.essence < (w.cost || 0)) return;
  player.essence -= w.cost || 0;
  player.ownedWeapons.push(k);
  player.weapon = k;
  populateDayScreen();
}

function equipWeapon(k) {
  if (!player.ownedWeapons.includes(k)) return;
  player.weapon = k;
  populateDayScreen();
}

// ===================== FINAL BOSS (NIGHT 99) =====================
function startFinalBossIntro() {
  let ending;
  if (player.dealsAccepted >= 5) ending = buildEnvoyEnding();
  else if (player.enemiesSpared >= 10 && player.allies.length >= 3) ending = buildBetrayalEnding();
  else ending = buildLoneWolfEnding();

  finalBossData = ending;
  if (ending.type === 'envoy') setFigure('boss:envoy:' + ending.name);
  else if (ending.type === 'betrayal') setFigure('boss:betrayal');
  else setFigure('boss:lonewolf');
  setGameState('FINALBOSS_INTRO');
  populateFinalBossIntro(ending);
}

function buildEnvoyEnding() {
  let topName = null, topCount = -1;
  Object.keys(player.envoyDealCounts).forEach(name => {
    if (player.envoyDealCounts[name] > topCount) { topCount = player.envoyDealCounts[name]; topName = name; }
  });
  return {
    type: 'envoy', name: topName || 'The Pale Voice',
    dialogue: "You called for me with every deal. Here I am.",
    pattern: 'chaos', duration: 15, hitDamage: 25,
  };
}

function buildBetrayalEnding() {
  return {
    type: 'betrayal', name: 'Your Allies',
    dialogue: "They made their own deal.",
    allyNames: player.allies.map(a => a.name),
    pattern: 'chaos', duration: 12, hitDamage: 20,
  };
}

function buildLoneWolfEnding() {
  return {
    type: 'lonewolf', name: 'The Dark',
    dialogue: "99 nights. And still nothing to show for it.",
    pattern: 'chaos', duration: 10, hitDamage: 15,
  };
}

function populateFinalBossIntro(ending) {
  const el = overlays.FINALBOSS_INTRO;
  let dialogueHtml = `<div class="envoyDeal">"${ending.dialogue}"</div>`;
  if (ending.type === 'betrayal' && ending.allyNames.length) {
    dialogueHtml = ending.allyNames.map(n => `<div class="envoyDeal">${n}: I'm sorry. We made our own deal.</div>`).join('');
  }
  el.innerHTML = `
    <div class="panel">
      <div class="envoyName">${ending.name}</div>
      ${dialogueHtml}
      <button class="fightBtn" onclick="startFinalBossDodge()">[Face the Dark]</button>
    </div>
  `;
}

function startFinalBossDodge() {
  const ending = finalBossData;
  triggerDodge({
    pattern: ending.pattern,
    duration: ending.duration,
    hitDamage: ending.hitDamage,
    endOnHit: false,
    isFinalBoss: true,
    speedMultiplier: renderPact ? 0.7 : 1,
    onSurvive: () => {
      sfxVictory();
      setFigure(null);
      setGameState('VICTORY');
      populateVictory();
    },
  });
}

function populateVictory() {
  document.getElementById('victoryStats').textContent =
    `Essence: ${player.essence} | Allies: ${player.allies.length} | Enemies spared: ${player.enemiesSpared} | Enemies fought: ${player.enemiesFought} | Deals accepted: ${player.dealsAccepted}`;
}

function triggerGameOver(text) {
  dodgeCtx = null;
  bullets = [];
  sfxGameOver();
  setFigure(null);
  setGameState('GAMEOVER');
  document.getElementById('gameoverText').textContent = text;
  document.getElementById('gameoverStats').textContent =
    `Fell on night ${currentNight} | Essence: ${player.essence} | Allies: ${player.allies.length}`;
}

// ===================== DODGE MINIGAME =====================
function triggerDodge(context) {
  dodgeCtx = context;
  bullets = [];
  soul.x = DODGE_BOX.x + DODGE_BOX.w / 2;
  soul.y = DODGE_BOX.y + DODGE_BOX.h / 2;
  dodgeState = {
    timer: context.duration,
    resolving: false, resolveTimer: 0,
    hitFlashTimer: 0,
    crossTimer: 0, spiralTimer: 0, burstTimer: 0,
    spiralRotation: 0,
    waveActive: false, waveDir: 1, currentWaveSpeedMult: 1,
  };
  setGameState('DODGE');
}

function spawnBullet(x, y, vx, vy) {
  bullets.push({ x, y, vx, vy, radius: 6, age: 0 });
}

function randomPerimeterPoint() {
  const side = Math.floor(Math.random() * 4);
  const b = DODGE_BOX;
  if (side === 0) return { x: b.x + Math.random() * b.w, y: b.y };
  if (side === 1) return { x: b.x + Math.random() * b.w, y: b.y + b.h };
  if (side === 2) return { x: b.x, y: b.y + Math.random() * b.h };
  return { x: b.x + b.w, y: b.y + Math.random() * b.h };
}

function updateCross(ndt, rateMult, speedMult) {
  dodgeState.crossTimer += ndt;
  const interval = 40 / rateMult;
  if (dodgeState.crossTimer >= interval) {
    dodgeState.crossTimer = 0;
    const cx = DODGE_BOX.x + DODGE_BOX.w / 2;
    const cy = DODGE_BOX.y + DODGE_BOX.h / 2;
    const spd = 2.5 * speedMult;
    spawnBullet(cx, DODGE_BOX.y, 0, spd);
    spawnBullet(cx, DODGE_BOX.y + DODGE_BOX.h, 0, -spd);
    spawnBullet(DODGE_BOX.x, cy, spd, 0);
    spawnBullet(DODGE_BOX.x + DODGE_BOX.w, cy, -spd, 0);
  }
}

function updateSpiral(ndt, rateMult, speedMult) {
  dodgeState.spiralTimer += ndt;
  const interval = 25 / rateMult;
  if (dodgeState.spiralTimer >= interval) {
    dodgeState.spiralTimer = 0;
    const cx = DODGE_BOX.x + DODGE_BOX.w / 2, cy = DODGE_BOX.y + DODGE_BOX.h / 2;
    const spd = 3 * speedMult;
    const baseAngle = dodgeState.spiralRotation * Math.PI / 180;
    for (let i = 0; i < 8; i++) {
      const angle = baseAngle + i * (Math.PI * 2 / 8);
      spawnBullet(cx, cy, Math.cos(angle) * spd, Math.sin(angle) * spd);
    }
    dodgeState.spiralRotation += 15;
  }
}

function updateBurst(ndt, rateMult, speedMult) {
  dodgeState.burstTimer += ndt;
  const interval = 50 / rateMult;
  if (dodgeState.burstTimer >= interval) {
    dodgeState.burstTimer = 0;
    const p = randomPerimeterPoint();
    const spd = 2 * speedMult;
    for (let i = 0; i < 12; i++) {
      const angle = i * (Math.PI * 2 / 12);
      spawnBullet(p.x, p.y, Math.cos(angle) * spd, Math.sin(angle) * spd);
    }
  }
}

function startNewWave() {
  dodgeState.waveActive = true;
  dodgeState.waveDir = -dodgeState.waveDir;
  const gapStart = DODGE_BOX.x + Math.random() * (DODGE_BOX.w - 80);
  const spd = 1.5 * (dodgeState.currentWaveSpeedMult || 1);
  const y = dodgeState.waveDir > 0 ? DODGE_BOX.y : DODGE_BOX.y + DODGE_BOX.h;
  const vy = dodgeState.waveDir > 0 ? spd : -spd;
  for (let x = DODGE_BOX.x; x <= DODGE_BOX.x + DODGE_BOX.w; x += 20) {
    if (x >= gapStart && x <= gapStart + 80) continue;
    bullets.push({ x, y, vx: 0, vy, radius: 6, isWave: true, age: 0 });
  }
}

function updateWave(ndt, speedMult) {
  dodgeState.currentWaveSpeedMult = speedMult;
  if (!dodgeState.waveActive) {
    startNewWave();
    return;
  }
  const remaining = bullets.filter(b => b.isWave);
  if (remaining.length === 0) startNewWave();
}

function updateBulletPattern(pattern, ndt, speedMult) {
  if (pattern === 'cross') updateCross(ndt, 1, speedMult);
  else if (pattern === 'spiral') updateSpiral(ndt, 1, speedMult);
  else if (pattern === 'burst') updateBurst(ndt, 1, speedMult);
  else if (pattern === 'wave') updateWave(ndt, speedMult);
  else if (pattern === 'chaos') {
    updateCross(ndt, 0.7, speedMult * 0.8);
    updateSpiral(ndt, 0.7, speedMult * 0.8);
    updateBurst(ndt, 0.7, speedMult * 0.8);
  }
}

function handleDodgeHit() {
  const dmg = dodgeCtx.hitDamage;
  const isFinal = dodgeCtx.isFinalBoss;
  sfxDodgeHit();
  player.hp = Math.max(0, player.hp - dmg);
  bullets = [];
  if (player.hp <= 0) {
    dodgeCtx = null;
    triggerGameOver(isFinal ? 'You were so close.' : 'The last pact is broken.');
    return;
  }
  if (dodgeCtx.endOnHit === false) {
    dodgeState.hitFlashTimer = 30;
    return;
  }
  const cb = dodgeCtx.onHit;
  dodgeCtx = null;
  cb && cb();
}

function finishDodge() {
  if (!dodgeCtx) return;
  const cb = dodgeCtx.onSurvive;
  dodgeCtx = null;
  bullets = [];
  cb && cb();
}

function updateDodge(dtMs, ndt) {
  if (!dodgeCtx) return;

  if (dodgeState.resolving) {
    dodgeState.resolveTimer -= ndt;
    if (dodgeState.resolveTimer <= 0) finishDodge();
    return;
  }

  const spd = player.effDodgeSpeed * ndt;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) soul.y -= spd;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) soul.y += spd;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) soul.x -= spd;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) soul.x += spd;
  soul.x = clamp(soul.x, DODGE_BOX.x + 8, DODGE_BOX.x + DODGE_BOX.w - 8);
  soul.y = clamp(soul.y, DODGE_BOX.y + 8, DODGE_BOX.y + DODGE_BOX.h - 8);

  updateBulletPattern(dodgeCtx.pattern, ndt, dodgeCtx.speedMultiplier || 1);

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * ndt;
    b.y += b.vy * ndt;
    b.age += ndt;
    if (b.x < DODGE_BOX.x - 20 || b.x > DODGE_BOX.x + DODGE_BOX.w + 20 ||
        b.y < DODGE_BOX.y - 20 || b.y > DODGE_BOX.y + DODGE_BOX.h + 20) {
      bullets.splice(i, 1);
    }
  }

  if (dodgeState.hitFlashTimer > 0) {
    dodgeState.hitFlashTimer -= ndt;
  } else {
    // Bullets are only lethal once they've traveled clear of their spawn
    // point, so patterns that emit from the soul's own position (e.g.
    // spiral bursting from box center, where the soul starts) can't
    // register an unavoidable zero-distance hit at the instant of spawn.
    for (const b of bullets) {
      if (b.age < 10) continue;
      const dx = soul.x - b.x, dy = soul.y - b.y;
      if (Math.sqrt(dx * dx + dy * dy) < 14) {
        handleDodgeHit();
        break;
      }
    }
  }

  if (!dodgeCtx) return;

  dodgeState.timer -= dtMs / 1000;
  if (dodgeState.timer <= 0 && !dodgeState.resolving) {
    dodgeState.resolving = true;
    dodgeState.resolveTimer = 30;
  }
}

// ===================== HELPERS =====================
function clampPlayer() {
  player.hp = clamp(player.hp, 0, player.maxHp);
  player.essence = Math.max(0, player.essence);
  currentNight = clamp(currentNight, 1, 99);
}

// ===================== 3D SCENE SYNC =====================
const ALLY_POSITIONS = [{ gx: 4, gy: 11 }, { gx: 6, gy: 11 }, { gx: 5, gy: 10 }];

function syncEnemies(ndt) {
  syncMap(enemyMeshes, nightEnemies, e => makeCharacter(e.type), (e, g) => {
    const def = ENEMY_TYPES[e.type] || ENEMY_TYPES.walker;
    const h = def.floating ? 0.32 + Math.sin(frameCount * 0.08 + e.phase) * 0.08 : 0;
    g.position.copy(worldPos(e.gridX, e.gridY, h));
    if (e.hitT > 0) e.hitT = Math.max(0, e.hitT - ndt);
    const pop = e.hitT > 0 ? 1 + (e.hitT / 8) * 0.22 : 1;
    const s = (CHAR_SPECS[e.type] ? CHAR_SPECS[e.type].scale : 1) * clamp(e.spawnT === undefined ? 1 : e.spawnT, 0.05, 1) * pop;
    g.scale.setScalar(s);
    if (g.userData.anim) {
      const ph = frameCount * (0.1 + def.speed * 4) + (e.phase || 0);
      const sw = Math.sin(ph) * 0.55;
      g.userData.anim.legL.rotation.x = sw;
      g.userData.anim.legR.rotation.x = -sw;
      g.userData.anim.armL.rotation.x = -sw * 0.7;
      g.userData.anim.armR.rotation.x = sw * 0.7;
    }
  });
}

function syncCorpses() {
  syncMap(corpseMeshes, corpses, () => {
    const g = new THREE.Group();
    g.add(mesh(geoBox(0.34, 0.09, 0.5), matL(0x191420), 0, 0.05, 0));
    g.add(mesh(geoBox(0.12, 0.05, 0.2), matL(0xddd6c2), 0, 0.11, 0.05));
    return shadowify(g, true, false);
  }, (c, g) => {
    const shiver = c.timer < 30 ? (Math.random() - 0.5) * 0.06 : 0;
    g.position.copy(worldPos(c.gx + shiver, c.gy));
  });
}

function syncMeteors() {
  syncMap(meteorMeshes, meteors, () => {
    const g = new THREE.Group();
    const ringGeo = cachedGeo('meteorRing', () => {
      const gg = new THREE.RingGeometry(0.75, 0.95, 24);
      gg.rotateX(-Math.PI / 2);
      return gg;
    });
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xff5a3c, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false }));
    ring.position.y = 0.03;
    g.add(ring);
    const ball = mesh(geoSphere(0.22, 10), matB(0xffb469), 0, 8, 0);
    const ballGlow = makeGlowSprite(0xff9955, 1.4, 0.9);
    ball.add(ballGlow);
    ball.visible = false;
    g.add(ball);
    g.userData.ring = ring;
    g.userData.ball = ball;
    return g;
  }, (m, g) => {
    g.position.copy(worldPos(m.gx, m.gy));
    if (m.t < 60) {
      g.userData.ring.visible = true;
      g.userData.ring.material.opacity = 0.3 + 0.25 * Math.sin(frameCount * 0.25);
      g.userData.ball.visible = false;
    } else {
      const f = (m.t - 60) / 14;
      g.userData.ring.visible = false;
      g.userData.ball.visible = true;
      g.userData.ball.position.set(1.4 * (1 - f), 7 * (1 - f) + 0.2, -0.6 * (1 - f));
    }
  });
}

function syncProjectiles() {
  syncMap(projectileMeshes, projectiles, () => {
    const g = new THREE.Group();
    const shaft = mesh(geoBox(0.03, 0.03, 0.34), matB(0xd9c9a0), 0, 0, 0);
    g.add(shaft);
    return g;
  }, (p, g) => {
    g.position.copy(p.pos);
    if (p.dir) {
      const target = new THREE.Vector3().copy(p.pos).add(p.dir);
      g.lookAt(target);
    }
  });
}

function syncDefender() {
  const visible = gameState === 'NIGHT' && nightPhase === 'marching';
  defenderMesh.visible = visible;
  if (!visible) return;
  syncDefenderWeapon();
  defenderMesh.position.copy(worldPos(defender.gridX, defender.gridY));
  defenderMesh.rotation.y = defender.angle;
  const a = defenderMesh.userData.anim;
  if (a) {
    const sw = defender.moving ? Math.sin(defender.walkPhase) * 0.6 : 0;
    a.legL.rotation.x = sw;
    a.legR.rotation.x = -sw;
    a.armL.rotation.x = -sw * 0.7;
    // weapon arm: walk swing, overridden by an attack swing that whips
    // the arm forward and back over ~12 frames
    let armR = sw * 0.7;
    if (defender.swingT > 0) {
      armR = -Math.sin((1 - defender.swingT / 12) * Math.PI) * 1.9;
    }
    a.armR.rotation.x = armR;
  }
}

function syncAllies() {
  const count = Math.min(player.allies.length, 3);
  while (allyGroup.children.length < count) {
    const d = makeAllyDiamond();
    const pos = ALLY_POSITIONS[allyGroup.children.length];
    d.position.copy(worldPos(pos.gx, pos.gy));
    allyGroup.add(d);
  }
  while (allyGroup.children.length > count) {
    allyGroup.remove(allyGroup.children[allyGroup.children.length - 1]);
  }
  allyGroup.children.forEach((d, i) => {
    d.userData.gem.rotation.y = frameCount * 0.04 + i;
    d.userData.gem.position.y = 0.45 + Math.sin(frameCount * 0.06 + i * 2) * 0.05;
  });
}

function syncAtmosphere() {
  const blood = nightEvent === 'bloodMoon' && !isQuietNight && gameState !== 'MENU';
  moonMat.color.setHex(blood ? 0xb03a34 : 0xc9cbde);
  moonGlow.material.color.setHex(blood ? 0xdc4637 : 0xc9cbde);
  moonLight.color.setHex(blood ? 0xd06050 : 0x9aa8e8);
  hemiLight.color.setHex(blood ? 0x5a3040 : 0x35406a);

  const denseFog = nightEvent === 'fog' && !isQuietNight &&
    (gameState === 'NIGHT' || gameState === 'DODGE');
  scene.fog.density += ((denseFog ? 0.085 : 0.028) - scene.fog.density) * 0.04;

  // torch + window flicker
  torchLights.forEach(t => {
    const flick = Math.sin(frameCount * 0.3 + t.seed * 7) * 0.5 + Math.random() * 0.3;
    t.light.intensity = 4.2 + flick * 1.6;
    t.flame.scale.setScalar(0.38 + flick * 0.07);
  });
  if (baseHouse) {
    const pulse = 0.5 + Math.sin(frameCount * 0.06) * 0.3;
    baseHouse.userData.winLight.intensity = 2.5 + pulse * 2.5;
    baseHouse.userData.winGlow.material.opacity = 0.4 + pulse * 0.4;
  }

  // sea waves
  const pos = seaGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    pos.setY(i, Math.sin(x * 0.5 + frameCount * 0.02) * 0.06 + Math.cos(z * 0.45 + frameCount * 0.016) * 0.06);
  }
  pos.needsUpdate = true;

  // drifting embers around the island
  if (Math.random() < 0.03) {
    spawnEmber(new THREE.Vector3((Math.random() - 0.5) * 9, -0.1, (Math.random() - 0.2) * 10), 0xff9955);
  }

  if (figureGroup) {
    const inner = figureGroup.userData.inner;
    if (inner && inner.userData.tick) inner.userData.tick(frameCount);
    if (inner && inner.userData.anim) {
      // idle sway for humanoid figures (the champion)
      inner.position.y = Math.sin(frameCount * 0.05) * 0.04;
    }
  }
}

// ===================== CAMERA =====================
let orbitAngle = 0.6;
const desiredPos = new THREE.Vector3();
const desiredLook = new THREE.Vector3();

function updateCamera(ndt) {
  const st = gameState;

  if (st === 'MENU' || st === 'DAY' || st === 'GAMEOVER' || st === 'VICTORY') {
    orbitAngle += 0.0018 * ndt;
    desiredPos.set(Math.sin(orbitAngle) * 12.5, 7.6, Math.cos(orbitAngle) * 12.5);
    desiredLook.set(0, 0, 0);
  } else if (st === 'ENVOY' || st === 'FINALBOSS_INTRO') {
    desiredPos.set(FIGURE_SPOT.x + 0.2, 2.3, FIGURE_SPOT.z + 5.4);
    desiredLook.set(FIGURE_SPOT.x, 1.2, FIGURE_SPOT.z);
  } else if (st === 'CHOICE' || (st === 'NIGHT' && nightPhase === 'specialAnnounce')) {
    desiredPos.set(FIGURE_SPOT.x + 1.2, 1.8, FIGURE_SPOT.z + 4.4);
    desiredLook.set(FIGURE_SPOT.x, 1.0, FIGURE_SPOT.z);
  } else if (st === 'DODGE') {
    desiredPos.set(FIGURE_SPOT.x, 3.4, FIGURE_SPOT.z + 7.6);
    desiredLook.set(FIGURE_SPOT.x, 0.9, FIGURE_SPOT.z);
  } else {
    // gameplay: fixed elevated view of the whole island — the screen
    // stays put while the defender moves across it
    desiredPos.set(0, 7.8, 11.8);
    desiredLook.set(0, 0.2, 0.5);
  }

  const snap = st === 'NIGHT_INTRO';
  const k = snap ? 1 : 1 - Math.pow(0.94, ndt);
  camera.position.lerp(desiredPos, k);
  camLook.lerp(desiredLook, k);

  if (shakeMag > 0.3) {
    camera.position.x += (Math.random() - 0.5) * shakeMag * 0.035;
    camera.position.y += (Math.random() - 0.5) * shakeMag * 0.035;
  }
  camera.lookAt(camLook);
}

// world point -> overlay canvas coordinates
const projTmp = new THREE.Vector3();
function worldToScreen(v) {
  projTmp.copy(v).project(camera);
  return {
    x: (projTmp.x * 0.5 + 0.5) * VW,
    y: (-projTmp.y * 0.5 + 0.5) * VH,
    behind: projTmp.z > 1,
  };
}

function drawHUD() {
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(8,6,14,0.62)';
  ctx.fillRect(10, 10, 196, 66);
  ctx.strokeStyle = '#2a2a3a';
  ctx.strokeRect(10.5, 10.5, 195, 65);

  ctx.fillStyle = '#ff2222';
  ctx.font = '14px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('♥', 18, 30);
  ctx.fillStyle = '#3a1010';
  ctx.fillRect(34, 19, 140, 10);
  const pct = clamp(player.hp / player.maxHp, 0, 1);
  const hpGrad = ctx.createLinearGradient(34, 0, 174, 0);
  hpGrad.addColorStop(0, '#8b0000');
  hpGrad.addColorStop(1, '#ff4444');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(34, 19, 140 * pct, 10);
  ctx.strokeStyle = '#4a1a1a';
  ctx.strokeRect(34.5, 19.5, 139, 9);

  ctx.save();
  ctx.translate(22, 42);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(-3.5, -3.5, 7, 7);
  ctx.restore();
  ctx.fillStyle = '#ffd700';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText(String(player.essence), 34, 47);

  ctx.fillStyle = '#b9a8d9';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText((WEAPONS[player.weapon] || WEAPONS.sword).name, 34, 64);

  const rx = VW - 180;
  ctx.fillStyle = 'rgba(8,6,14,0.62)';
  ctx.fillRect(rx, 10, 170, nightEvent ? 52 : 34);
  ctx.strokeStyle = '#2a2a3a';
  ctx.strokeRect(rx + 0.5, 10.5, 169, nightEvent ? 51 : 33);
  ctx.fillStyle = '#c0a0ff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NIGHT ' + currentNight, rx + 85, 32);
  if (nightEvent) {
    ctx.fillStyle = EVENT_COLORS[nightEvent] || '#e8e8e8';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText(NIGHT_EVENTS[nightEvent].name, rx + 85, 52);
  }

}

function drawFloatingNumbers() {
  ctx.save();
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center';
  floatingNumbers.forEach(f => {
    const s = worldToScreen(worldPos(f.gx, f.gy, f.h));
    if (s.behind) return;
    ctx.globalAlpha = Math.max(0, f.alpha);
    ctx.fillStyle = f.color || '#ff3333';
    ctx.fillText(f.text, s.x, s.y);
  });
  ctx.restore();
}

function drawEnemyHpPips() {
  ctx.save();
  nightEnemies.forEach(e => {
    if (!(e.maxHp > 1 && e.hp < e.maxHp)) return;
    const s = worldToScreen(worldPos(e.gridX, e.gridY, 1.7));
    if (s.behind) return;
    const w = 8, total = e.maxHp * w + (e.maxHp - 1) * 2;
    for (let i = 0; i < e.maxHp; i++) {
      ctx.fillStyle = i < e.hp ? '#ff5544' : '#3a2626';
      ctx.fillRect(s.x - total / 2 + i * (w + 2), s.y, w, 3);
    }
  });
  ctx.restore();
}

function drawNightIntro() {
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VW, VH);
  const t = introTimer;
  let alpha;
  if (t < 500) alpha = t / 500;
  else if (t < 1000) alpha = 1;
  else alpha = 1 - (t - 1000) / 500;
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.fillStyle = '#c0a0ff';
  ctx.font = 'bold 48px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`Night ${currentNight}`, VW / 2, VH / 2);
  if (nightEvent && NIGHT_EVENTS[nightEvent]) {
    ctx.fillStyle = EVENT_COLORS[nightEvent] || '#e8e8e8';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(NIGHT_EVENTS[nightEvent].name, VW / 2, VH / 2 + 48);
    ctx.fillStyle = 'rgba(200,200,210,0.75)';
    ctx.font = 'italic 13px "Courier New", monospace';
    ctx.fillText(NIGHT_EVENTS[nightEvent].tagline, VW / 2, VH / 2 + 72);
  }
  ctx.restore();
}

function drawDodgeBox() {

  ctx.fillStyle = 'rgba(5,5,13,0.92)';
  ctx.fillRect(DODGE_BOX.x, DODGE_BOX.y, DODGE_BOX.w, DODGE_BOX.h);
