  ctx.fillText(isTouchDevice ? 'DRAG TO DODGE' : 'WASD / ARROWS TO DODGE', DODGE_BOX.x + DODGE_BOX.w / 2, DODGE_BOX.y + DODGE_BOX.h + 24);

  ctx.restore();
}

function drawVignette() {
  const grad = ctx.createRadialGradient(
    VW / 2, VH / 2, Math.min(VW, VH) * 0.32,
    VW / 2, VH / 2, Math.max(VW, VH) * 0.72
  );
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);
}

function drawOverlay() {
  ctx.clearRect(0, 0, VW, VH);

  if (gameState === 'NIGHT_INTRO') {
    drawNightIntro();
    return;
  }

  const live = gameState === 'NIGHT';

  if (nightEvent === 'bloodMoon' && live && nightPhase !== 'quiet') {
    ctx.fillStyle = 'rgba(170,30,30,0.07)';
    ctx.fillRect(0, 0, VW, VH);
  }

  if (live && nightPhase === 'marching') {
    drawEnemyHpPips();
  }
  drawFloatingNumbers();

  if (live && nightPhase === 'quiet') {
    ctx.fillStyle = 'rgba(232,232,232,0.5)';
    ctx.font = '20px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('The night is quiet...', VW / 2, VH / 2);
  }
  if (live && nightPhase === 'marching') {
    ctx.fillStyle = 'rgba(210,210,220,0.4)';
    ctx.font = '12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isTouchDevice ? 'D-PAD TO MOVE   ·   TAP ATTACK' : 'WASD / ARROWS MOVE   ·   SPACE ATTACK', VW / 2, VH - 22);
  }
  if (live && whisper && whisper.text) {
    const wa = clamp(Math.min(whisper.t / 60, (260 - whisper.t) / 40), 0, 1);
    ctx.fillStyle = `rgba(180,170,200,${0.75 * wa})`;
    ctx.font = 'italic 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(whisper.text, VW / 2, VH - 48);
  }
  if (live && nightPhase === 'specialAnnounce') {
    const flash = Math.abs(Math.sin(nightPhaseTimer * 0.1));
    ctx.fillStyle = `rgba(153,51,204,${0.15 * flash})`;
    ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#cc88ff';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(specialEnemyThisNight.name, VW / 2, 140);
  }

  if (gameState === 'DODGE') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, VW, VH);
    drawDodgeBox();
  }

  if (live && nightPhase === 'marching') drawHUD();

  drawVignette();
}

// ===================== MAIN LOOP =====================
function update(dtMs, ndt) {
  frameCount += ndt;
  updateFloatingNumbers(ndt);
  shakeMag = Math.max(0, shakeMag - 0.3 * ndt);
  clampPlayer();

  if (gameState === 'NIGHT_INTRO') updateNightIntro(dtMs);
  else if (gameState === 'NIGHT') updateNight(ndt);
  else if (gameState === 'DODGE') updateDodge(dtMs, ndt);

  updateTouchControlsVisibility();
}

function sync3D(ndt) {
  syncEnemies(ndt);
  syncCorpses();
  syncMeteors();
  syncProjectiles();
  syncDefender();
  syncAllies();
  syncAtmosphere();
  updateFX(ndt);
  updateCamera(ndt);
}

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  // hard landscape lock: freeze the game behind the rotate screen
  if (isPortrait) {
    lastTime = 0;
    return;
  }

  if (!lastTime) lastTime = timestamp;
  let dt = timestamp - lastTime;
  lastTime = timestamp;
  dt = Math.min(dt, 50);
  const ndt = dt / 16.6667;

  update(dt, ndt);
  sync3D(ndt);
  renderer.render(scene, camera);
  drawOverlay();
}

// ===================== BOOT =====================
resetState();
// build a preview island behind the menu
generateIslandData();
rebuildIsland();
setGameState('MENU');
requestAnimationFrame(gameLoop);

// expose handlers used by inline onclick attributes
window.startGame = startGame;
window.onFight = onFight;
window.onSpare = onSpare;
window.startEnvoyDodge = startEnvoyDodge;
window.acceptEnvoyDeal = acceptEnvoyDeal;
window.buyUpgrade = buyUpgrade;
window.buyWeapon = buyWeapon;
window.equipWeapon = equipWeapon;
window.beginNextNight = () => setupNight(currentNight + 1);
window.startFinalBossDodge = startFinalBossDodge;

// tiny hook for automated smoke tests
window.__lp = {
  get state() { return gameState + ':' + nightPhase; },
  jump: n => setupNight(n),
  clearWave: () => { nightEnemies.length = 0; corpses.length = 0; },
};
</script>
