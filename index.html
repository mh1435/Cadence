// ===================== ISOMETRIC HELPERS =====================
const TILE_W = 64;
const TILE_H = 32;
const ISO_ORIGIN_X = 400;
const ISO_ORIGIN_Y = 150;
const GRID_COLS = 10;
const GRID_ROWS = 12;
const BASE_GX = 5;
const BASE_GY = 11;

function toIso(gridX, gridY) {
  return {
    x: ISO_ORIGIN_X + (gridX - gridY) * (TILE_W / 2),
    y: ISO_ORIGIN_Y + (gridX + gridY) * (TILE_H / 2)
  };
}

function drawIsoTile(ctx, gridX, gridY, fillColor, strokeColor) {
  const { x, y } = toIso(gridX, gridY);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + TILE_W / 2, y + TILE_H / 2);
  ctx.lineTo(x, y + TILE_H);
  ctx.lineTo(x - TILE_W / 2, y + TILE_H / 2);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.stroke();
}

function drawIsoPrism(ctx, cx, cyBase, halfW, halfH, height, topColor, leftColor, rightColor) {
  const topY = cyBase - height;
  ctx.beginPath();
  ctx.moveTo(cx, topY - halfH);
  ctx.lineTo(cx + halfW, topY);
  ctx.lineTo(cx, topY + halfH);
  ctx.lineTo(cx - halfW, topY);
  ctx.closePath();
  ctx.fillStyle = topColor;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx - halfW, topY);
  ctx.lineTo(cx, topY + halfH);
  ctx.lineTo(cx, cyBase + halfH);
  ctx.lineTo(cx - halfW, cyBase);
  ctx.closePath();
  ctx.fillStyle = leftColor;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx, topY + halfH);
  ctx.lineTo(cx + halfW, topY);
  ctx.lineTo(cx + halfW, cyBase);
  ctx.lineTo(cx, cyBase + halfH);
  ctx.closePath();
  ctx.fillStyle = rightColor;
  ctx.fill();
}

function drawIsoDiamondBig(cx, cy, halfW, halfH, color) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - halfH);
  ctx.lineTo(cx + halfW, cy);
  ctx.lineTo(cx, cy + halfH);
  ctx.lineTo(cx - halfW, cy);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = '#e8e8e8';
  ctx.stroke();
  ctx.restore();
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

};

function spriteFromArt(rows, scale) {
  scale = scale || 2;
  const h = rows.length, w = rows[0].length;
  const c = makeCanvas(w * scale, h * scale);
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const col = PAL[rows[y][x]];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x * scale, y * scale, scale, scale);
    }
  }
  return c;
}

function makeTileSprite(topCol, edgeCol, specks, seed) {
  const c = makeCanvas(68, 36);
  const g = c.getContext('2d');
  const cx = 34, cy = 2;
  function tilePath() {
    g.beginPath();
    g.moveTo(cx, cy);
    g.lineTo(cx + 32, cy + 16);
    g.lineTo(cx, cy + 32);
    g.lineTo(cx - 32, cy + 16);
    g.closePath();
  }

  g.fillStyle = topCol;
  g.fill();
  g.save();
  tilePath();
  g.clip();
  const rng = mulberry32(seed);
  for (let i = 0; i < 30; i++) {
    const px = cx + (rng() * 2 - 1) * 29;
    const py = cy + 16 + (rng() * 2 - 1) * 13;
    g.fillStyle = specks[Math.floor(rng() * specks.length)];
    g.fillRect(px, py, 2, rng() < 0.3 ? 2 : 1);
  }
  g.restore();
  tilePath();
  g.strokeStyle = edgeCol;
  g.lineWidth = 1;
  g.stroke();
  return c;
}

    y: (clientY - rect.top) * (600 / rect.height),

}

function setupNight(n) {
  currentNight = clamp(n, 1, 99);
  if (spareBanned && spareBanLift !== Infinity && currentNight >= spareBanLift) spareBanned = false;

  floatingNumbers = [];
  nightPhase = null;
  nightPhaseTimer = 0;
  introTimer = 0;

  const trng = mulberry32(currentNight * 7919 + 13);

  // island tile map: sand ring, dirt path to the base, textured grass inside
  tileMap = [];
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    const row = [];
    for (let gx = 0; gx < GRID_COLS; gx++) {
      let t;
      if (gx === 0 || gx === GRID_COLS - 1 || gy === 0 || gy === GRID_ROWS - 1) t = 'sand';
      else if (gx === 5) t = 'dirt';
      else if (gy >= 10 && gx >= 4 && gx <= 6) t = 'dirt';
      else t = trng() < 0.5 ? 'grass1' : 'grass2';
      row.push(t);
    }
    tileMap.push(row);
  }

  // scenery props scattered off the path, away from the base courtyard
  nightProps = [];
  const propKinds = ['pine', 'pine', 'deadTree', 'rock', 'grave', 'ruin', 'pine', 'rock', 'deadTree'];
  const usedCells = new Set();
  for (let i = 0; i < propKinds.length; i++) {
    let gx, gy, tries = 0;
    do {
      gx = 1 + Math.floor(trng() * (GRID_COLS - 2));
      gy = 1 + Math.floor(trng() * (GRID_ROWS - 3));
      tries++;
    } while (tries < 30 && (gx === 5 || (gy >= 9 && gx >= 3 && gx <= 7) || usedCells.has(gx + ',' + gy)));
    if (tries >= 30) continue;
    usedCells.add(gx + ',' + gy);
    nightProps.push({ gx, gy, kind: propKinds[i] });
  }
  nightProps.push({ gx: 4.55, gy: 10.4, kind: 'torch' });
  nightProps.push({ gx: 5.45, gy: 10.4, kind: 'torch' });

  isQuietNight = player.nightsWithQuiet.includes(currentNight);

  // random night event
  nightEvent = null;
  if (!isQuietNight && currentNight >= 3 && currentNight !== 99 && Math.random() < 0.45) {
    const pool = ['bloodMoon', 'fog', 'meteors', 'treasure', 'restless'];
    nightEvent = pool[Math.floor(Math.random() * pool.length)];
  }

  chests = [];
  if (nightEvent === 'treasure') {
    for (let i = 0; i < 3; i++) chests.push({ gx: 1 + Math.random() * 7, gy: 2 + Math.random() * 7, opened: false });
  }
  meteors = []; meteorTimer = 60;
  corpses = []; projectiles = []; chainArcs = []; fxParticles = [];
  whisper = { text: null, t: 0 };
  shakeMag = 0;

  if (isQuietNight) {
    nightEnemies = [];
  } else {
    let count = 3 + Math.floor(currentNight / 5);
    if (nightEvent === 'bloodMoon') count = Math.ceil(count * 1.5);
    nightEnemies = [];
    for (let i = 0; i < count; i++) {
      let type = 'walker';
      const roll = Math.random();
      if (currentNight >= 12 && roll < 0.15) type = 'wraith';
      else if (currentNight >= 8 && roll < 0.3) type = 'brute';
      else if (currentNight >= 4 && roll < 0.55) type = 'runner';
      const def = ENEMY_TYPES[type];
      const gx = Math.floor(Math.random() * GRID_COLS);
      nightEnemies.push({
        type,
        gridX: gx,
        baseGX: gx,
        gridY: -0.4,
        phase: Math.random() * Math.PI * 2,
        hp: def.hp,
        maxHp: def.hp,
        speed: def.speed * (0.9 + Math.random() * 0.2),
        spawnT: 0,
      });
    }
  }

  specialEnemyThisNight = (currentNight !== 99 && specialEnemySchedule[currentNight]) ? { ...specialEnemySchedule[currentNight] } : null;

  defender.gridX = 5;
  defender.gridY = 8;
  defender.attackCooldown = 0;
  defender.facing = 1;
  defender.moving = false;
  defender.walkPhase = 0;
  attackFlashes = [];
  deathBursts = [];

  setGameState('NIGHT_INTRO');
}

// ===================== NIGHT UPDATE =====================
function updateNightIntro(dtMs) {
  introTimer += dtMs;
  if (introTimer >= 1500) {
    introTimer = 0;
    nightPhase = isQuietNight ? 'quiet' : 'marching';
    nightPhaseTimer = 0;
    setGameState('NIGHT');
  }
}

function updateNight(ndt) {
  if (player.hp <= 0) { triggerGameOver('The last pact is broken.'); return; }

  if (nightPhase === 'quiet') {
    nightPhaseTimer += ndt;
    if (nightPhaseTimer > 120) afterBasics();
    return;
  }

  if (nightPhase === 'marching') {
    updateDefender(ndt);
    updateProjectiles(ndt);
    updateMeteors(ndt);
    updateChests();
    updateCorpses(ndt);
    updateWhisper(ndt);

    for (let i = nightEnemies.length - 1; i >= 0; i--) {
      const e = nightEnemies[i];
      if (player.effAutoResolvePower >= 9999) {
        nightEnemies.splice(i, 1);
        continue;
      }
      const def = ENEMY_TYPES[e.type] || ENEMY_TYPES.walker;
      e.spawnT = Math.min(1, (e.spawnT || 0) + 0.03 * ndt);
      e.gridY += e.speed * ndt;
      if (def.zigzag) e.gridX = clamp(e.baseGX + Math.sin(e.gridY * 0.9 + e.phase) * 1.3, 0, GRID_COLS - 1);
      if (e.gridY >= GRID_ROWS - 1) {
        const dmg = Math.max(1, 5 - player.effAutoResolvePower) * def.dmgMult;
        player.hp = Math.max(0, player.hp - dmg);
        spawnFloatingDamage(dmg);
        shakeMag = Math.max(shakeMag, 4);
        nightEnemies.splice(i, 1);
        if (player.hp <= 0) { triggerGameOver('The last pact is broken.'); return; }
      }
    }
    if (nightEnemies.length === 0 && corpses.length === 0) afterBasics();
    return;
  }

  if (nightPhase === 'specialAnnounce') {
    nightPhaseTimer += ndt;
    if (nightPhaseTimer > 72) beginSpecialDodge();
    return;
  }
}

function afterBasics() {
  if (currentNight === 99) {
    startFinalBossIntro();
  } else if (specialEnemyThisNight) {
    nightPhase = 'specialAnnounce';
    nightPhaseTimer = 0;
  } else {
    resolveNightEnd();
  }
}

function resolveNightEnd() {
  if (player.hp <= 0) { triggerGameOver('The last pact is broken.'); return; }
  if (currentNight % 10 === 0 && envoySchedule[currentNight]) {
    beginEnvoy();
  } else {
    beginDay();
  }
}

function spawnFloat(x, y, text, color) {
  floatingNumbers.push({ x, y, text, color, alpha: 1, vy: -1 });
}

function spawnFloatingDamage(value) {
  const iso = toIso(BASE_GX, BASE_GY);
  spawnFloat(iso.x, iso.y, '-' + Math.round(value), '#ff3333');
}

function updateFloatingNumbers(ndt) {
  for (let i = floatingNumbers.length - 1; i >= 0; i--) {
    const f = floatingNumbers[i];
    f.y -= 1 * ndt;
    f.alpha -= 0.02 * ndt;
    if (f.alpha <= 0) floatingNumbers.splice(i, 1);
  }
}

// ===================== DEFENDER, WEAPONS & NIGHT SYSTEMS =====================
function gridDist(a, b) {
  const dx = a.gridX - b.gridX, dy = a.gridY - b.gridY;
  return Math.sqrt(dx * dx + dy * dy);
}

function updateDefender(ndt) {
  const spd = 0.14 * ndt;
  let dx = 0, dy = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) { dx -= spd; dy -= spd; }
  if (keys['ArrowDown'] || keys['s'] || keys['S']) { dx += spd; dy += spd; }
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx -= spd; dy += spd; }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx += spd; dy -= spd; }
  defender.gridX = clamp(defender.gridX + dx, 0, GRID_COLS - 1);
  defender.gridY = clamp(defender.gridY + dy, 0, GRID_ROWS - 2);
  defender.moving = (dx !== 0 || dy !== 0);
  if (defender.moving) {
    defender.walkPhase += 0.35 * ndt;
    const screenDx = dx - dy;
    if (screenDx > 0.001) defender.facing = 1;
    else if (screenDx < -0.001) defender.facing = -1;
  }

  if (defender.attackCooldown > 0) defender.attackCooldown -= ndt;
  if (keys[' '] && defender.attackCooldown <= 0) performAttack();
}

function nearestEnemyTo(gx, gy, maxDist) {
  let best = null, bestD = maxDist;
  for (const e of nightEnemies) {
    const d = Math.sqrt((e.gridX - gx) * (e.gridX - gx) + (e.gridY - gy) * (e.gridY - gy));
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function performAttack() {
  const w = WEAPONS[player.weapon] || WEAPONS.sword;
  defender.attackCooldown = w.cd;
  const dIso = toIso(defender.gridX, defender.gridY);

  if (w.kind === 'ranged') {
    attackFlashes.push({ x: dIso.x + defender.facing * 8, y: dIso.y + 4, life: 8, big: false, col: '#d9c9a0', dir: defender.facing });
    const target = nearestEnemyTo(defender.gridX, defender.gridY, Infinity);
    if (target) {
      const tIso = toIso(target.gridX, target.gridY);
      projectiles.push({ x: dIso.x, y: dIso.y - 6, tx: tIso.x, ty: tIso.y - 10, target, speed: 10, dmg: w.dmg });
    }
    return;
  }

  attackFlashes.push({ x: dIso.x + defender.facing * 10, y: dIso.y + 6, life: 12, big: !!w.aoe, col: w.chain ? '#9fd4ff' : '#ffe9a8', dir: defender.facing });
  const inRange = nightEnemies.filter(e => gridDist(e, defender) <= w.range);
  if (!inRange.length) return;

  let targets;
  if (w.aoe) targets = inRange.slice();
  else targets = [inRange.reduce((a, b) => gridDist(a, defender) < gridDist(b, defender) ? a : b)];

  const primary = targets[0];
  let chainTargets = [];
  let pIso = null;
  if (w.chain && primary) {
    pIso = toIso(primary.gridX, primary.gridY);
    chainTargets = nightEnemies.filter(e => e !== primary && !targets.includes(e) && gridDist(e, primary) <= 2.5).slice(0, w.chain);
  }
  targets.forEach(t => damageEnemy(t, w.dmg));
  chainTargets.forEach(e => {
    const eIso = toIso(e.gridX, e.gridY);
    chainArcs.push({ x1: pIso.x, y1: pIso.y - 10, x2: eIso.x, y2: eIso.y - 10, life: 10 });
    damageEnemy(e, 1);
  });
}

function damageEnemy(e, dmg) {
  const idx = nightEnemies.indexOf(e);
  if (idx < 0) return;
  e.hp -= dmg;
  const iso = toIso(e.gridX, e.gridY);
  spawnSparks(iso.x, iso.y - 8, '#ffcc88', 4);
  if (e.hp > 0) {
    e.gridY = Math.max(0, e.gridY - 0.18);
    return;
  }
  const def = ENEMY_TYPES[e.type] || ENEMY_TYPES.walker;
  let gain = def.essence;
  if (nightEvent === 'bloodMoon') gain *= 2;
  player.essence += gain;
  spawnFloat(iso.x, iso.y - 20, '+' + gain, '#ffd700');
  deathBursts.push({ x: iso.x, y: iso.y + TILE_H / 2, life: 16 });
  if (nightEvent === 'restless' && !e.revived && Math.random() < 0.4) {
    corpses.push({ gx: e.gridX, gy: e.gridY, type: e.type, timer: 140 });
  }
  nightEnemies.splice(idx, 1);
}

function updateProjectiles(ndt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.target && nightEnemies.includes(p.target)) {
      const iso = toIso(p.target.gridX, p.target.gridY);
      p.tx = iso.x;
      p.ty = iso.y - 10;
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 12) {
      if (p.target && nightEnemies.includes(p.target)) damageEnemy(p.target, p.dmg);
      else spawnSparks(p.tx, p.ty, '#998866', 3);
      projectiles.splice(i, 1);
      continue;
    }
    p.vx = dx / d * p.speed;
    p.vy = dy / d * p.speed;
    p.x += p.vx * ndt;
    p.y += p.vy * ndt;
  }
}

function updateMeteors(ndt) {
  if (nightEvent !== 'meteors') return;
  meteorTimer -= ndt;
  if (meteorTimer <= 0) {
    meteorTimer = 90 + Math.random() * 70;
    meteors.push({ gx: Math.random() * (GRID_COLS - 1), gy: 0.5 + Math.random() * 9.5, t: 0 });
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.t += ndt;
    if (m.t >= 74) {
      const iso = toIso(m.gx, m.gy);
      spawnSparks(iso.x, iso.y + TILE_H / 2, '#ff8844', 14);
      shakeMag = Math.max(shakeMag, 7);
      for (let j = nightEnemies.length - 1; j >= 0; j--) {
        const e = nightEnemies[j];
        const d = Math.sqrt((e.gridX - m.gx) ** 2 + (e.gridY - m.gy) ** 2);
        if (d <= 1.2) damageEnemy(e, 99);
      }
      const dd = Math.sqrt((defender.gridX - m.gx) ** 2 + (defender.gridY - m.gy) ** 2);
      if (dd <= 1.1) {
        player.hp = Math.max(0, player.hp - 8);
        const dIso = toIso(defender.gridX, defender.gridY);
        spawnFloat(dIso.x, dIso.y - 24, '-8', '#ff3333');
        if (player.hp <= 0) { triggerGameOver('The sky claimed you.'); return; }
      }
      meteors.splice(i, 1);
    }
  }
}

function updateChests() {
  chests.forEach(c => {
    if (c.opened) return;
    const d = Math.sqrt((defender.gridX - c.gx) ** 2 + (defender.gridY - c.gy) ** 2);
    if (d < 0.85) {
      c.opened = true;
      const gain = 12 + Math.floor(currentNight / 3);
      player.essence += gain;
      const iso = toIso(c.gx, c.gy);
      spawnFloat(iso.x, iso.y - 14, '+' + gain, '#ffd700');
      spawnSparks(iso.x, iso.y, '#ffd700', 10);
    }
  });
}

function updateCorpses(ndt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.timer -= ndt;
    if (c.timer <= 0) {
      const def = ENEMY_TYPES[c.type] || ENEMY_TYPES.walker;
      nightEnemies.push({
        type: c.type, gridX: c.gx, baseGX: c.gx, gridY: c.gy,
        phase: Math.random() * Math.PI * 2,
        hp: 1, maxHp: 1, speed: def.speed, spawnT: 0, revived: true,
      });
      corpses.splice(i, 1);
    }
  }
}

function updateWhisper(ndt) {
  if (!whisper.text && Math.random() < 0.002 * ndt) {
    whisper.text = WHISPERS[Math.floor(Math.random() * WHISPERS.length)];
    whisper.t = 260;
  }
  if (whisper.text) {
    whisper.t -= ndt;
    if (whisper.t <= 0) whisper.text = null;
  }
}

function spawnSparks(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    fxParticles.push({
      x, y,
      vx: (Math.random() - 0.5) * 3.2,
      vy: -Math.random() * 2.6 - 0.4,
      life: 1, col,
      size: 1.5 + Math.random() * 1.5,
    });
  }
}

function updateAttackFX(ndt) {
  for (let i = attackFlashes.length - 1; i >= 0; i--) {
    attackFlashes[i].life -= ndt;
    if (attackFlashes[i].life <= 0) attackFlashes.splice(i, 1);
  }
  for (let i = deathBursts.length - 1; i >= 0; i--) {
    deathBursts[i].life -= ndt;
    if (deathBursts[i].life <= 0) deathBursts.splice(i, 1);
  }
  for (let i = chainArcs.length - 1; i >= 0; i--) {
    chainArcs[i].life -= ndt;
    if (chainArcs[i].life <= 0) chainArcs.splice(i, 1);
  }
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i];
    p.x += p.vx * ndt;
    p.y += p.vy * ndt;
    p.vy += 0.12 * ndt;
    p.life -= 0.045 * ndt;
    if (p.life <= 0) fxParticles.splice(i, 1);
  }
}

// ===================== SPECIAL ENEMY DODGE =====================
function beginSpecialDodge() {
  const data = specialEnemyThisNight;
  const mem = specialEnemyMemory[data.name] || { spared: false, fought: false };
  let dialogue = data.dialogue;
  let bonusMultiplier = 1;
  let speedMultiplier = 1;
  if (mem.spared) {
    dialogue = "You again. Good.";
    bonusMultiplier = 2;
  } else if (mem.fought) {
    speedMultiplier = 1.2;
  }
  currentSpecialEncounter = { name: data.name, dialogue, spareBonus: data.spareBonus, bonusMultiplier };

  triggerDodge({
    pattern: data.pattern,
    duration: 6,
    hitDamage: 12,
    endOnHit: true,
    speedMultiplier,
    onHit: () => showChoice(true),
    onSurvive: () => showChoice(false),
  });
}

function showChoice(wasHit) {
  currentChoiceHit = wasHit;
  setGameState('CHOICE');
  populateChoiceScreen();
}

function populateChoiceScreen() {
  const el = overlays.CHOICE;
  const data = currentSpecialEncounter;
  const stateLine = currentChoiceHit
    ? '<div class="struckText">You were struck.</div>'
    : '<div class="enduredTextSmall">You endured it.</div>';
  el.innerHTML = `
    <div class="panel">
      <div class="enemyName">${data.name}</div>
      <div class="enemyDialogue">"${data.dialogue}"</div>
      ${stateLine}
      <div class="choiceButtons">
        <button class="fightBtn" onclick="onFight()">[FIGHT]</button>
        <button class="spareBtn" ${spareBanned ? 'disabled' : ''} onclick="onSpare()">[SPARE]</button>
      </div>
    </div>
  `;
}

function onFight() {
  const data = currentSpecialEncounter;
  player.essence += 10 + Math.floor(currentNight / 5);
  player.enemiesFought++;
  specialEnemyMemory[data.name] = specialEnemyMemory[data.name] || { spared: false, fought: false };
  specialEnemyMemory[data.name].fought = true;
  const idx = player.allies.findIndex(a => a.name === data.name);
  if (idx >= 0) player.allies.splice(idx, 1);
  clampPlayer();
  resolveNightEnd();
}

function onSpare() {
  if (spareBanned) return;
  const data = currentSpecialEncounter;
  applySpareBonus(data.spareBonus, data.bonusMultiplier);
  player.enemiesSpared++;
  specialEnemyMemory[data.name] = specialEnemyMemory[data.name] || { spared: false, fought: false };
  specialEnemyMemory[data.name].spared = true;
  clampPlayer();
  resolveNightEnd();
}

function applySpareBonus(bonus, mult) {
  mult = mult || 1;
  if (bonus.type === 'hp') {
    player.hp = Math.min(player.maxHp, player.hp + bonus.value * mult);
  } else if (bonus.type === 'essence') {
    player.essence += bonus.value * mult;
  } else if (bonus.type === 'ally') {
    const existing = player.allies.find(a => a.name === bonus.allyName);
    if (existing) {
      Object.keys(bonus.allyBonus).forEach(k => {
        existing.bonus[k] = (existing.bonus[k] || 0) + bonus.allyBonus[k] * mult;
      });
    } else {
      const scaled = {};
      Object.keys(bonus.allyBonus).forEach(k => scaled[k] = bonus.allyBonus[k] * mult);
      player.allies.push({ name: bonus.allyName, bonus: scaled });
    }
  }
  player.essence = Math.max(0, player.essence);
}

function beginEnvoy() {
  currentEnvoy = { ...envoySchedule[currentNight] };
  setGameState('ENVOY');
  populateEnvoyScreen();
}

function populateEnvoyScreen() {
  const el = overlays.ENVOY;
  el.innerHTML = `
    <div class="panel">
      <div class="envoyName">${currentEnvoy.name}</div>
      <div class="envoyDeal">${currentEnvoy.deal}</div>
      <div class="choiceButtons">
        <button class="fightBtn" onclick="startEnvoyDodge()">[Dodge to Reject]</button>
        <button class="spareBtn" onclick="acceptEnvoyDeal()">[Accept the Deal]</button>
      </div>
    </div>
  `;
}

function acceptEnvoyDeal() {
  currentEnvoy.effect();
  player.dealsAccepted++;
  player.envoyDealCounts[currentEnvoy.name] = (player.envoyDealCounts[currentEnvoy.name] || 0) + 1;
  afterEnvoyEffect();
}

function startEnvoyDodge() {
  triggerDodge({
    pattern: currentEnvoy.pattern,
    duration: 5,
    hitDamage: 0,
    endOnHit: true,
    speedMultiplier: 1,
    onHit: () => {
      currentEnvoy.effect();
      player.dealsAccepted++;
      player.envoyDealCounts[currentEnvoy.name] = (player.envoyDealCounts[currentEnvoy.name] || 0) + 1;
      afterEnvoyEffect();
    },
    onSurvive: () => {
      player.dealsRejected++;
      beginDay();
    },
  });
}

function afterEnvoyEffect() {
  clampPlayer();
  if (player.hp <= 0) triggerGameOver('The deal cost you everything.');
  else beginDay();
}

// ===================== DAY =====================
function beginDay() {
  recalcAllyBonuses();
  clampPlayer();
  setGameState('DAY');
  populateDayScreen();
}

function recalcAllyBonuses() {
  let dodgeBonus = 0, powerBonus = 0;
  player.allies.forEach(a => {
    dodgeBonus += a.bonus.dodgeSpeed || 0;
    powerBonus += a.bonus.autoResolvePower || 0;
  });
  player.effDodgeSpeed = player.dodgeSpeed + dodgeBonus;
  player.effAutoResolvePower = player.autoResolvePower + powerBonus;
}

function populateDayScreen() {
  const el = overlays.DAY;
  const hpPct = Math.round((player.hp / player.maxHp) * 100);
  const alliesHtml = player.allies.length
    ? player.allies.map(a => {
        const bonusStr = Object.entries(a.bonus).map(([k, v]) => `${k} +${v}`).join(', ');
        return `<div><span class="allyDiamond"></span>${a.name} — ${bonusStr}</div>`;
      }).join('')
    : '<div style="color:#555;">No allies</div>';

  const shopHtml = upgrades.map(u => {
    const afford = player.essence >= u.cost;
    return `<div class="shopItem">
      <strong>${u.label}</strong><br>${u.desc}<br>Cost: ${u.cost} essence
      <button ${afford ? '' : 'disabled'} onclick="buyUpgrade('${u.key}')">Buy</button>
    </div>`;
  }).join('');

  const weaponsHtml = Object.keys(WEAPONS).map(k => {
    const w = WEAPONS[k];
    const owned = player.ownedWeapons.includes(k);
    const equipped = player.weapon === k;
    const cost = w.cost || 0;
    let btn;
    if (equipped) btn = `<button disabled>Equipped</button>`;
    else if (owned) btn = `<button onclick="equipWeapon('${k}')">Equip</button>`;
    else btn = `<button ${player.essence >= cost ? '' : 'disabled'} onclick="buyWeapon('${k}')">Buy · ${cost}</button>`;
    return `<div class="shopItem ${equipped ? 'equippedItem' : ''}">
      <strong>${w.name}</strong><br>${w.desc}
      ${btn}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="panel">
      <div class="dayHeader">Dawn — Night ${currentNight} survived</div>
      <div class="hpBarOuter"><div class="hpBarInner" style="width:${hpPct}%"></div></div>
      <div class="hpText">HP: ${Math.round(player.hp)} / ${player.maxHp}</div>
      <div class="essenceLine">Essence: ${player.essence}</div>
      <div class="alliesList">${alliesHtml}</div>
      <div class="sectionLabel">UPGRADES</div>
      <div class="shopGrid">${shopHtml}</div>
      <div class="sectionLabel">ARMORY</div>
      <div class="shopGrid">${weaponsHtml}</div>
      <button class="beginNightBtn" onclick="setupNight(currentNight + 1)">[Begin Night ${currentNight + 1}]</button>
    </div>
  `;
}

function buyUpgrade(key) {
  const up = upgrades.find(u => u.key === key);
  if (!up || player.essence < up.cost) return;
  player.essence -= up.cost;
  up.apply();
  recalcAllyBonuses();
  clampPlayer();
  populateDayScreen();
}

function buyWeapon(k) {
  const w = WEAPONS[k];
  if (!w || player.ownedWeapons.includes(k) || player.essence < (w.cost || 0)) return;
  player.essence -= w.cost || 0;
  player.ownedWeapons.push(k);
  player.weapon = k;
  populateDayScreen();
}

function equipWeapon(k) {
  if (!player.ownedWeapons.includes(k)) return;
  player.weapon = k;
  populateDayScreen();
}

// ===================== FINAL BOSS (NIGHT 99) =====================
function startFinalBossIntro() {
  let ending;
  if (player.dealsAccepted >= 5) ending = buildEnvoyEnding();
  else if (player.enemiesSpared >= 10 && player.allies.length >= 3) ending = buildBetrayalEnding();
  else ending = buildLoneWolfEnding();

  finalBossData = ending;
  setGameState('FINALBOSS_INTRO');
  populateFinalBossIntro(ending);
}

function buildEnvoyEnding() {
  let topName = null, topCount = -1;
  Object.keys(player.envoyDealCounts).forEach(name => {
    if (player.envoyDealCounts[name] > topCount) { topCount = player.envoyDealCounts[name]; topName = name; }
  });
  return {
    type: 'envoy', name: topName || 'The Pale Voice',
    dialogue: "You called for me with every deal. Here I am.",
    pattern: 'chaos', duration: 15, hitDamage: 25,
  };
}

function buildBetrayalEnding() {
  return {
    type: 'betrayal', name: 'Your Allies',

}

function buildLoneWolfEnding() {

}

function populateFinalBossIntro(ending) {

  el.innerHTML = `
    <div class="panel">
      <div class="envoyName">${ending.name}</div>
      ${dialogueHtml}
      <button class="fightBtn" onclick="startFinalBossDodge()">[Face the Dark]</button>
    </div>

function startFinalBossDodge() {
  const ending = finalBossData;
  triggerDodge({
    pattern: ending.pattern,
    duration: ending.duration,
    hitDamage: ending.hitDamage,
    endOnHit: false,
    isFinalBoss: true,
    speedMultiplier: renderPact ? 0.7 : 1,

      setGameState('VICTORY');
      populateVictory();
    },

}

function populateVictory() {

    `Essence: ${player.essence} | Allies: ${player.allies.length} | Enemies spared: ${player.enemiesSpared} | Enemies fought: ${player.enemiesFought} | Deals accepted: ${player.dealsAccepted}`;

// ===================== DODGE MINIGAME =====================
function triggerDodge(context) {
  dodgeCtx = context;
  bullets = [];
  soul.x = 400; soul.y = 300;
  dodgeState = {
    timer: context.duration,
    resolving: false, resolveTimer: 0,
    hitFlashTimer: 0,
    crossTimer: 0, spiralTimer: 0, burstTimer: 0,
    spiralRotation: 0,
    waveActive: false, waveDir: 1, currentWaveSpeedMult: 1,
  };
  setGameState('DODGE');
}

function spawnBullet(x, y, vx, vy) {
  bullets.push({ x, y, vx, vy, radius: 6, age: 0 });
}

function randomPerimeterPoint() {
  const side = Math.floor(Math.random() * 4);
  const b = DODGE_BOX;
  if (side === 0) return { x: b.x + Math.random() * b.w, y: b.y };
  if (side === 1) return { x: b.x + Math.random() * b.w, y: b.y + b.h };
  if (side === 2) return { x: b.x, y: b.y + Math.random() * b.h };
  return { x: b.x + b.w, y: b.y + Math.random() * b.h };
}

function updateCross(ndt, rateMult, speedMult) {
  dodgeState.crossTimer += ndt;
  const interval = 40 / rateMult;
  if (dodgeState.crossTimer >= interval) {
    dodgeState.crossTimer = 0;
    const cx = DODGE_BOX.x + DODGE_BOX.w / 2;
    const cy = DODGE_BOX.y + DODGE_BOX.h / 2;
    const spd = 2.5 * speedMult;
    spawnBullet(cx, DODGE_BOX.y, 0, spd);
    spawnBullet(cx, DODGE_BOX.y + DODGE_BOX.h, 0, -spd);
    spawnBullet(DODGE_BOX.x, cy, spd, 0);
    spawnBullet(DODGE_BOX.x + DODGE_BOX.w, cy, -spd, 0);
  }
}

function updateSpiral(ndt, rateMult, speedMult) {
  dodgeState.spiralTimer += ndt;
  const interval = 25 / rateMult;
  if (dodgeState.spiralTimer >= interval) {
    dodgeState.spiralTimer = 0;
    const cx = DODGE_BOX.x + DODGE_BOX.w / 2, cy = DODGE_BOX.y + DODGE_BOX.h / 2;
    const spd = 3 * speedMult;
    const baseAngle = dodgeState.spiralRotation * Math.PI / 180;
    for (let i = 0; i < 8; i++) {
      const angle = baseAngle + i * (Math.PI * 2 / 8);
      spawnBullet(cx, cy, Math.cos(angle) * spd, Math.sin(angle) * spd);
    }
    dodgeState.spiralRotation += 15;
  }
}

function updateBurst(ndt, rateMult, speedMult) {
  dodgeState.burstTimer += ndt;
  const interval = 50 / rateMult;
  if (dodgeState.burstTimer >= interval) {
    dodgeState.burstTimer = 0;
    const p = randomPerimeterPoint();
    const spd = 2 * speedMult;
    for (let i = 0; i < 12; i++) {
      const angle = i * (Math.PI * 2 / 12);
      spawnBullet(p.x, p.y, Math.cos(angle) * spd, Math.sin(angle) * spd);
    }
  }
}

function startNewWave() {
  dodgeState.waveActive = true;
  dodgeState.waveDir = -dodgeState.waveDir;
  const gapStart = DODGE_BOX.x + Math.random() * (DODGE_BOX.w - 80);
  const spd = 1.5 * (dodgeState.currentWaveSpeedMult || 1);
  const y = dodgeState.waveDir > 0 ? DODGE_BOX.y : DODGE_BOX.y + DODGE_BOX.h;
  const vy = dodgeState.waveDir > 0 ? spd : -spd;
  for (let x = DODGE_BOX.x; x <= DODGE_BOX.x + DODGE_BOX.w; x += 20) {
    if (x >= gapStart && x <= gapStart + 80) continue;
    bullets.push({ x, y, vx: 0, vy, radius: 6, isWave: true, age: 0 });
  }
}

function updateWave(ndt, speedMult) {
  dodgeState.currentWaveSpeedMult = speedMult;
  if (!dodgeState.waveActive) {
    startNewWave();
    return;
  }
  const remaining = bullets.filter(b => b.isWave);
  if (remaining.length === 0) startNewWave();
}

function updateBulletPattern(pattern, ndt, speedMult) {
  if (pattern === 'cross') updateCross(ndt, 1, speedMult);
  else if (pattern === 'spiral') updateSpiral(ndt, 1, speedMult);
  else if (pattern === 'burst') updateBurst(ndt, 1, speedMult);
  else if (pattern === 'wave') updateWave(ndt, speedMult);
  else if (pattern === 'chaos') {
    updateCross(ndt, 0.7, speedMult * 0.8);
    updateSpiral(ndt, 0.7, speedMult * 0.8);
    updateBurst(ndt, 0.7, speedMult * 0.8);
  }
}

function handleDodgeHit() {
  const dmg = dodgeCtx.hitDamage;
  const isFinal = dodgeCtx.isFinalBoss;
  player.hp = Math.max(0, player.hp - dmg);
  bullets = [];
  if (player.hp <= 0) {
    dodgeCtx = null;
    triggerGameOver(isFinal ? 'You were so close.' : 'The last pact is broken.');
    return;
  }
  if (dodgeCtx.endOnHit === false) {
    dodgeState.hitFlashTimer = 30;
    return;
  }
  const cb = dodgeCtx.onHit;
  dodgeCtx = null;
  cb && cb();
}

function finishDodge() {
  if (!dodgeCtx) return;
  const cb = dodgeCtx.onSurvive;
  dodgeCtx = null;
  bullets = [];
  cb && cb();
}

function updateDodge(dtMs, ndt) {
  if (!dodgeCtx) return;

  if (dodgeState.resolving) {
    dodgeState.resolveTimer -= ndt;
    if (dodgeState.resolveTimer <= 0) finishDodge();
    return;
  }

  const spd = player.effDodgeSpeed * ndt;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) soul.y -= spd;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) soul.y += spd;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) soul.x -= spd;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) soul.x += spd;
  soul.x = clamp(soul.x, DODGE_BOX.x + 8, DODGE_BOX.x + DODGE_BOX.w - 8);
  soul.y = clamp(soul.y, DODGE_BOX.y + 8, DODGE_BOX.y + DODGE_BOX.h - 8);

  updateBulletPattern(dodgeCtx.pattern, ndt, dodgeCtx.speedMultiplier || 1);

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * ndt;
    b.y += b.vy * ndt;
    b.age += ndt;
    if (b.x < DODGE_BOX.x - 20 || b.x > DODGE_BOX.x + DODGE_BOX.w + 20 ||
        b.y < DODGE_BOX.y - 20 || b.y > DODGE_BOX.y + DODGE_BOX.h + 20) {
      bullets.splice(i, 1);
    }
  }

  if (dodgeState.hitFlashTimer > 0) {
    dodgeState.hitFlashTimer -= ndt;
  } else {
    // Bullets are only lethal once they've traveled clear of their spawn
    // point, so patterns that emit from the soul's own position (e.g.
    // spiral bursting from box center, where the soul starts) can't
    // register an unavoidable zero-distance hit at the instant of spawn.
    for (const b of bullets) {
      if (b.age < 10) continue;
      const dx = soul.x - b.x, dy = soul.y - b.y;
      if (Math.sqrt(dx * dx + dy * dy) < 14) {
        handleDodgeHit();
        break;
      }
    }
  }

  if (!dodgeCtx) return;

  dodgeState.timer -= dtMs / 1000;
  if (dodgeState.timer <= 0 && !dodgeState.resolving) {
    dodgeState.resolving = true;
    dodgeState.resolveTimer = 30;
  }
}

// ===================== HELPERS =====================
function clampPlayer() {
  player.hp = clamp(player.hp, 0, player.maxHp);
  player.essence = Math.max(0, player.essence);
  currentNight = clamp(currentNight, 1, 99);
}

// ===================== DRAWING: NIGHT SCENE =====================
function drawSpriteEntity(spr, gx, gy, opts) {
  opts = opts || {};
  const iso = toIso(gx, gy);
  const groundY = iso.y + TILE_H / 2;
  ctx.save();
  if (opts.alpha !== undefined) ctx.globalAlpha *= clamp(opts.alpha, 0, 1);

  ctx.fillStyle = opts.floating ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(iso.x, groundY + 2, spr.width * 0.3, 3.4, 0, 0, Math.PI * 2);
  ctx.fill();

  const bob = opts.floating ? Math.sin(frameCount * 0.08 + (opts.phase || 0)) * 3 - 6 : 0;
  let legH = 0;
  if (!opts.floating) {
    legH = 6;
    const ph = opts.walkPhase === undefined ? frameCount * 0.18 + (opts.phase || 0) : opts.walkPhase;
    const sw = opts.still ? 0 : Math.sin(ph) * 3;
    ctx.fillStyle = opts.legColor || '#14101c';
    ctx.fillRect(iso.x - 5 + sw, groundY - legH, 4, legH);
    ctx.fillRect(iso.x + 1 - sw, groundY - legH, 4, legH);
  }
  const dy = groundY - legH - spr.height + bob;
  if (opts.flip) {
    ctx.translate(iso.x, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(spr, -spr.width / 2, dy);
  } else {
    ctx.drawImage(spr, iso.x - spr.width / 2, dy);
  }
  ctx.restore();
}

function drawEnemySprite(e) {
  const def = ENEMY_TYPES[e.type] || ENEMY_TYPES.walker;
  drawSpriteEntity(ASSETS.chars[def.sprite], e.gridX, e.gridY, {
    alpha: e.spawnT === undefined ? 1 : e.spawnT,
    floating: def.floating,
    phase: e.phase,
    walkPhase: frameCount * (0.1 + def.speed * 4) + (e.phase || 0),
  });
  if (e.maxHp > 1 && e.hp < e.maxHp) {
    const iso = toIso(e.gridX, e.gridY);
    const w = 8, total = e.maxHp * w + (e.maxHp - 1) * 2;
    for (let i = 0; i < e.maxHp; i++) {
      ctx.fillStyle = i < e.hp ? '#ff5544' : '#3a2626';
      ctx.fillRect(iso.x - total / 2 + i * (w + 2), iso.y - 44, w, 3);
    }
  }
}

function drawDefenderSprite() {
  drawSpriteEntity(ASSETS.chars.defender, defender.gridX, defender.gridY, {
    flip: defender.facing < 0,
    walkPhase: defender.walkPhase,
    still: !defender.moving,
    legColor: '#1a1410',
  });
}

function drawCorpse(c) {
  const iso = toIso(c.gx, c.gy);
  const groundY = iso.y + TILE_H / 2;
  const shiver = c.timer < 30 ? (Math.random() - 0.5) * 2 : 0;
  ctx.fillStyle = '#191420';
  ctx.beginPath();
  ctx.ellipse(iso.x + shiver, groundY - 2, 9, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ddd6c2';
  ctx.fillRect(iso.x - 2 + shiver, groundY - 5, 4, 2);
}

function drawChest(c) {
  const spr = c.opened ? ASSETS.props.chestOpen : ASSETS.props.chest;
  const iso = toIso(c.gx, c.gy);
  const groundY = iso.y + TILE_H / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(iso.x, groundY + 2, 10, 3.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.drawImage(spr, iso.x - spr.width / 2, groundY - spr.height + 2);
  if (!c.opened && Math.sin(frameCount * 0.12 + c.gx * 5) > 0.7) {
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(iso.x + 6, groundY - 24, 2, 2);
  }
}

function drawProp(p) {
  const iso = toIso(p.gx, p.gy);
  const groundY = iso.y + TILE_H / 2;
  if (p.kind === 'torch') {
    ctx.fillStyle = '#4a3520';
    ctx.fillRect(iso.x - 2, groundY - 22, 4, 22);
    const flick = Math.sin(frameCount * 0.3 + p.gx * 7);
    const r = 4 + flick * 1.5;
    const glow = ctx.createRadialGradient(iso.x, groundY - 26, 2, iso.x, groundY - 26, 26);
    glow.addColorStop(0, 'rgba(255,150,70,0.35)');
    glow.addColorStop(1, 'rgba(255,150,70,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(iso.x, groundY - 26, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9944';
    ctx.beginPath();
    ctx.arc(iso.x, groundY - 26, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd27f';
    ctx.beginPath();
    ctx.arc(iso.x, groundY - 27, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  const spr = ASSETS.props[p.kind];
  if (!spr) return;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(iso.x, groundY + 2, spr.width * 0.32, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.drawImage(spr, iso.x - spr.width / 2, groundY - spr.height + 4);
}

function drawSea() {
  ctx.save();
  const g = ctx.createRadialGradient(400, 400, 60, 400, 400, 440);
  g.addColorStop(0, '#0d1626');
  g.addColorStop(1, '#05070d');
  ctx.beginPath();
  ctx.ellipse(400, 400, 440, 215, 0, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.clip();
  for (let i = 0; i < 4; i++) {
    const yy = 300 + i * 55 + Math.sin(frameCount * 0.01 + i * 2) * 6;
    ctx.globalAlpha = 0.05 + 0.03 * Math.sin(frameCount * 0.02 + i);
    ctx.strokeStyle = '#7fa8d0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x <= 800; x += 16) {
      const y = yy + Math.sin(x * 0.02 + frameCount * 0.02 + i) * 3;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawCliffs() {
  const H = 16;
  ctx.fillStyle = '#241a10';
  ctx.beginPath();
  for (let gx = 0; gx < GRID_COLS; gx++) {
    const p = toIso(gx, GRID_ROWS - 1);
    ctx.moveTo(p.x - 32, p.y + 16);
    ctx.lineTo(p.x, p.y + 32);
    ctx.lineTo(p.x, p.y + 32 + H);
    ctx.lineTo(p.x - 32, p.y + 16 + H);
    ctx.closePath();
  }
  ctx.fill();
  ctx.fillStyle = '#2b2015';
  ctx.beginPath();
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    const p = toIso(GRID_COLS - 1, gy);
    ctx.moveTo(p.x + 32, p.y + 16);
    ctx.lineTo(p.x, p.y + 32);
    ctx.lineTo(p.x, p.y + 32 + H);
    ctx.lineTo(p.x + 32, p.y + 16 + H);
    ctx.closePath();
  }
  ctx.fill();
  // foam line at the waterline
  ctx.strokeStyle = `rgba(170,195,220,${0.1 + 0.06 * Math.sin(frameCount * 0.05)})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let gx = 0; gx < GRID_COLS; gx++) {
    const p = toIso(gx, GRID_ROWS - 1);
    ctx.moveTo(p.x - 32, p.y + 16 + H);
    ctx.lineTo(p.x, p.y + 32 + H);
  }
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    const p = toIso(GRID_COLS - 1, gy);
    ctx.moveTo(p.x, p.y + 32 + H);
    ctx.lineTo(p.x + 32, p.y + 16 + H);
  }
  ctx.stroke();
}

function drawTiles() {
  for (let gy = 0; gy < GRID_ROWS; gy++) {
    for (let gx = 0; gx < GRID_COLS; gx++) {
      const t = (tileMap[gy] && tileMap[gy][gx]) || 'grass1';
      const iso = toIso(gx, gy);
      ctx.drawImage(ASSETS.tiles[t], iso.x - 34, iso.y - 2);
    }
  }
}

function drawBaseStructure() {
  const iso = toIso(BASE_GX, BASE_GY);
  const bottom = iso.y + TILE_H;
  const spr = ASSETS.base;
  ctx.drawImage(spr, iso.x - spr.width / 2, bottom - spr.height + 6);
  const pulse = 0.5 + Math.sin(frameCount * 0.06) * 0.3;
  const wx = iso.x - spr.width / 2 + ASSETS.baseWindow.x;
  const wy = bottom - spr.height + 6 + ASSETS.baseWindow.y;
  ctx.save();
  ctx.globalAlpha *= pulse;
  const glow = ctx.createRadialGradient(wx, wy, 1, wx, wy, 18);
  glow.addColorStop(0, 'rgba(255,181,77,0.8)');
  glow.addColorStop(1, 'rgba(255,181,77,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(wx, wy, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffb54d';
  ctx.fillRect(wx - 4, wy - 4, 8, 8);
  ctx.restore();
}

function drawProjectiles() {
  projectiles.forEach(p => {
    const ang = Math.atan2(p.vy || 0, p.vx || 1);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(ang);
    ctx.strokeStyle = '#d9c9a0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.lineTo(4, 0);
    ctx.stroke();
    ctx.fillStyle = '#ecece4';
    ctx.beginPath();
    ctx.moveTo(7, 0); ctx.lineTo(2, -2.5); ctx.lineTo(2, 2.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
}

function drawMeteorWarnings() {
  meteors.forEach(m => {
    if (m.t >= 60) return;
    const iso = toIso(m.gx, m.gy);
    const pulse = 0.3 + 0.25 * Math.sin(frameCount * 0.25);
    ctx.strokeStyle = `rgba(255,90,60,${pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(iso.x, iso.y + TILE_H / 2, 26, 13, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(iso.x, iso.y + TILE_H / 2, 10, 5, 0, 0, Math.PI * 2);
    ctx.stroke();
  });
}

function drawMeteorsFalling() {
  meteors.forEach(m => {
    if (m.t < 60) return;
    const f = (m.t - 60) / 14;
    const iso = toIso(m.gx, m.gy);
    const y = iso.y + TILE_H / 2 - 160 * (1 - f);
    const x = iso.x + 40 * (1 - f);
    ctx.strokeStyle = 'rgba(255,150,80,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 18, y - 34);
    ctx.lineTo(x, y);
    ctx.stroke();
    const glow = ctx.createRadialGradient(x, y, 1, x, y, 16);
    glow.addColorStop(0, 'rgba(255,190,110,0.9)');
    glow.addColorStop(1, 'rgba(255,120,50,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a56a3a';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  });
}

let fogCanvas = makeCanvas(800, 600);
function drawFogOverlay() {
  const g = fogCanvas.getContext('2d');
  g.clearRect(0, 0, 800, 600);
  g.fillStyle = 'rgba(8,12,18,0.86)';
  g.fillRect(0, 0, 800, 600);
  g.globalCompositeOperation = 'destination-out';
  const holes = [
    { p: toIso(defender.gridX, defender.gridY), r: 150 },
    { p: toIso(BASE_GX, BASE_GY), r: 110 },
  ];
  holes.forEach(h => {
    const grad = g.createRadialGradient(h.p.x, h.p.y, 10, h.p.x, h.p.y, h.r);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.beginPath();
    g.arc(h.p.x, h.p.y, h.r, 0, Math.PI * 2);
    g.fill();
  });
  g.globalCompositeOperation = 'source-over';
  ctx.drawImage(fogCanvas, 0, 0);
}

function drawMoon() {
  const blood = nightEvent === 'bloodMoon' && !isQuietNight;
  const mx = 650, my = 86, r = 34;
  const glow = ctx.createRadialGradient(mx, my, r * 0.5, mx, my, r * 3);
  glow.addColorStop(0, blood ? 'rgba(220,70,55,0.28)' : 'rgba(200,205,235,0.16)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(mx, my, r * 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = blood ? '#b03a34' : '#c9cbde';
  ctx.beginPath();
  ctx.arc(mx, my, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  [[12, -8, 7], [-10, 6, 5], [2, 14, 4]].forEach(([ox, oy, cr]) => {
    ctx.beginPath();
    ctx.arc(mx + ox, my + oy, cr, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawStars() {

  stars.forEach(s => {

    ctx.globalAlpha = tw * 0.55;

    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);

}

function drawAmbientParticles() {

    ctx.globalAlpha = clamp(p.life, 0, 1) * 0.5 * flicker;

function drawAttackFX() {
  ctx.save();
  attackFlashes.forEach(f => {
    ctx.globalAlpha = clamp(f.life / 12, 0, 1);
    ctx.strokeStyle = f.col || '#ffe9a8';
    ctx.lineWidth = f.big ? 4 : 3;
    const r = f.big ? 24 : 16;
    ctx.beginPath();
    if ((f.dir || 1) > 0) ctx.arc(f.x, f.y, r, -0.85, 0.85);
    else ctx.arc(f.x, f.y, r, Math.PI - 0.85, Math.PI + 0.85);
    ctx.stroke();
    ctx.globalAlpha *= 0.5;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if ((f.dir || 1) > 0) ctx.arc(f.x, f.y, r - 6, -0.7, 0.7);
    else ctx.arc(f.x, f.y, r - 6, Math.PI - 0.7, Math.PI + 0.7);
    ctx.stroke();
  });
  deathBursts.forEach(b => {
    const t = 1 - clamp(b.life / 16, 0, 1);
    ctx.globalAlpha = clamp(b.life / 16, 0, 1);
    ctx.fillStyle = '#ff6644';
    for (let i = 0; i < 5; i++) {
      const ang = (i / 5) * Math.PI * 2;
      const r = 4 + t * 14;
      ctx.beginPath();
      ctx.arc(b.x + Math.cos(ang) * r, b.y + Math.sin(ang) * r, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  chainArcs.forEach(a => {
    ctx.globalAlpha = clamp(a.life / 10, 0, 1);
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(120,180,255,0.35)' : '#bfe4ff';
      ctx.lineWidth = pass === 0 ? 5 : 2;
      ctx.beginPath();
      ctx.moveTo(a.x1, a.y1);
      for (let s = 1; s < 4; s++) {
        const f = s / 4;
        const mx = a.x1 + (a.x2 - a.x1) * f + (Math.random() - 0.5) * 10;
        const my = a.y1 + (a.y2 - a.y1) * f + (Math.random() - 0.5) * 10;
        ctx.lineTo(mx, my);
      }
      ctx.lineTo(a.x2, a.y2);
      ctx.stroke();
    }
  });
  fxParticles.forEach(p => {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawAllyDiamond(gx, gy) {
  const iso = toIso(gx, gy);
  const cx = iso.x, cy = iso.y + TILE_H / 2;
  const glow = ctx.createRadialGradient(cx, cy - 4, 1, cx, cy - 4, 14);
  glow.addColorStop(0, 'rgba(192,160,255,0.4)');
  glow.addColorStop(1, 'rgba(192,160,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy - 4, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy - 10);
  ctx.lineTo(cx + 6, cy - 3);
  ctx.lineTo(cx, cy + 4);
  ctx.lineTo(cx - 6, cy - 3);
  ctx.closePath();
  ctx.fillStyle = '#c0a0ff';
  ctx.fill();
  ctx.strokeStyle = '#e5d5ff';
  ctx.stroke();
}

function drawNightScene(alpha) {
  alpha = alpha === undefined ? 1 : alpha;
  const live = gameState === 'NIGHT';
  ctx.save();
  if (live && shakeMag > 0.3) ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
  ctx.globalAlpha = alpha;

  drawSea();
  drawCliffs();
  drawTiles();

  if (nightEvent === 'meteors') drawMeteorWarnings();

  const entities = [];
  nightProps.forEach(p => entities.push({ depth: p.gx + p.gy, draw: () => drawProp(p) }));
  entities.push({ depth: BASE_GX + BASE_GY + 0.3, draw: drawBaseStructure });
  const allyPositions = [{ gx: 4, gy: 11 }, { gx: 6, gy: 11 }, { gx: 5, gy: 10 }];
  player.allies.slice(0, 3).forEach((a, i) => {
    const pos = allyPositions[i];
    entities.push({ depth: pos.gx + pos.gy + 0.1, draw: () => drawAllyDiamond(pos.gx, pos.gy) });
  });
  chests.forEach(c => entities.push({ depth: c.gx + c.gy, draw: () => drawChest(c) }));
  corpses.forEach(c => entities.push({ depth: c.gx + c.gy, draw: () => drawCorpse(c) }));
  nightEnemies.forEach(e => entities.push({ depth: e.gridX + e.gridY, draw: () => drawEnemySprite(e) }));
  if (live && nightPhase === 'marching') {
    entities.push({ depth: defender.gridX + defender.gridY + 0.01, draw: drawDefenderSprite });
  }
  if (live && nightPhase === 'specialAnnounce' && specialEnemyThisNight) {
    entities.push({ depth: 11, draw: () => drawSpriteEntity(ASSETS.chars.champion, 5, 6, { still: true }) });
  }
  entities.sort((a, b) => a.depth - b.depth);
  entities.forEach(en => en.draw());

  drawBaseGlow();
  drawProjectiles();
  if (nightEvent === 'meteors') drawMeteorsFalling();

  if (nightEvent === 'fog' && (live || gameState === 'DODGE')) drawFogOverlay();
  if (nightEvent === 'bloodMoon') {
    ctx.fillStyle = 'rgba(170,30,30,0.09)';
    ctx.fillRect(0, 0, 800, 600);
  }

  if (live && nightPhase === 'quiet') {
    ctx.fillStyle = 'rgba(232,232,232,0.5)';
    ctx.font = '20px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('The night is quiet...', 400, 300);
  }
  if (live && nightPhase === 'marching') {
    ctx.fillStyle = 'rgba(210,210,220,0.4)';
    ctx.font = '12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isTouchDevice ? 'D-PAD TO MOVE   ·   TAP ATTACK' : 'WASD / ARROWS MOVE   ·   SPACE ATTACK', 400, 578);
  }
  if (live && whisper && whisper.text) {
    const wa = clamp(Math.min(whisper.t / 60, (260 - whisper.t) / 40), 0, 1);
    ctx.fillStyle = `rgba(180,170,200,${0.75 * wa})`;
    ctx.font = 'italic 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(whisper.text, 400, 552);
  }
  if (live && nightPhase === 'specialAnnounce') {
    const flash = Math.abs(Math.sin(nightPhaseTimer * 0.1));
    ctx.fillStyle = `rgba(153,51,204,${0.15 * flash})`;
    ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = '#cc88ff';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(specialEnemyThisNight.name, 400, 200);
  }

  ctx.restore();
  if (live && nightPhase === 'marching') drawHUD();
  drawFloatingNumbers();
  drawAttackFX();
}

function drawFloatingNumbers() {
  ctx.save();
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center';
  floatingNumbers.forEach(f => {
    ctx.globalAlpha = Math.max(0, f.alpha);
    ctx.fillStyle = f.color || '#ff3333';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.restore();
}

function drawNightIntro() {
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 800, 600);
  const t = introTimer;
  let alpha;
  if (t < 500) alpha = t / 500;
  else if (t < 1000) alpha = 1;
  else alpha = 1 - (t - 1000) / 500;
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.fillStyle = '#c0a0ff';
  ctx.font = 'bold 48px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`Night ${currentNight}`, 400, 300);
  if (nightEvent && NIGHT_EVENTS[nightEvent]) {
    ctx.fillStyle = EVENT_COLORS[nightEvent] || '#e8e8e8';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(NIGHT_EVENTS[nightEvent].name, 400, 348);
    ctx.fillStyle = 'rgba(200,200,210,0.75)';
    ctx.font = 'italic 13px "Courier New", monospace';
    ctx.fillText(NIGHT_EVENTS[nightEvent].tagline, 400, 372);
  }
  ctx.restore();
}

function drawDodgeBox() {
  ctx.save();
  ctx.fillStyle = '#05050d';
  ctx.fillRect(DODGE_BOX.x, DODGE_BOX.y, DODGE_BOX.w, DODGE_BOX.h);
  ctx.strokeStyle = '#c0a0ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(DODGE_BOX.x, DODGE_BOX.y, DODGE_BOX.w, DODGE_BOX.h);

  if (dodgeCtx) {
    const pct = clamp(dodgeState.timer / dodgeCtx.duration, 0, 1);
    ctx.strokeStyle = '#3a2a5a';
    ctx.strokeRect(DODGE_BOX.x, DODGE_BOX.y - 12, DODGE_BOX.w, 6);
    ctx.fillStyle = '#c0a0ff';
    ctx.fillRect(DODGE_BOX.x, DODGE_BOX.y - 12, DODGE_BOX.w * pct, 6);
  }

  ctx.fillStyle = '#ffffff';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = '#ff2222';
  ctx.font = '16px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('♥', soul.x, soul.y);
  ctx.textBaseline = 'alphabetic';

  if (dodgeState.resolving) {
    ctx.fillStyle = '#c0a0ff';
    ctx.font = '18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('You endured it.', DODGE_BOX.x + DODGE_BOX.w / 2, DODGE_BOX.y + DODGE_BOX.h / 2);
  }

  ctx.fillStyle = 'rgba(210,210,220,0.4)';
  ctx.font = '12px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(isTouchDevice ? 'DRAG TO DODGE' : 'WASD / ARROWS TO DODGE', DODGE_BOX.x + DODGE_BOX.w / 2, DODGE_BOX.y + DODGE_BOX.h + 24);

  ctx.restore();
}

function drawEnvoyFigure(name, cx, cy, s) {
  const t = frameCount;
  ctx.save();
  if (name === 'The Pale Voice') {
    const hover = Math.sin(t * 0.03) * 6;
    ctx.fillStyle = '#c6c6da';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 150 * s + hover);
    ctx.quadraticCurveTo(cx + 55 * s, cy - 60 * s + hover, cx + 38 * s, cy);
    ctx.quadraticCurveTo(cx, cy + 14 * s, cx - 38 * s, cy);
    ctx.quadraticCurveTo(cx - 55 * s, cy - 60 * s + hover, cx, cy - 150 * s + hover);
    ctx.fill();
    ctx.fillStyle = 'rgba(90,90,120,0.35)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 150 * s + hover);
    ctx.quadraticCurveTo(cx + 18 * s, cy - 60 * s + hover, cx + 8 * s, cy);
    ctx.lineTo(cx - 6 * s, cy);
    ctx.quadraticCurveTo(cx + 4 * s, cy - 70 * s + hover, cx, cy - 150 * s + hover);
    ctx.fill();
    ctx.fillStyle = '#f0f0f6';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 106 * s + hover, 16 * s, 22 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d0a14';
    ctx.beginPath();
    ctx.ellipse(cx - 6 * s, cy - 110 * s + hover, 2.4 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 6 * s, cy - 110 * s + hover, 2.4 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const ang = t * 0.02 + i * (Math.PI * 2 / 3);
      ctx.fillStyle = 'rgba(176,176,204,0.6)';
      ctx.beginPath();
      ctx.arc(cx + Math.cos(ang) * 70 * s, cy - 80 * s + Math.sin(ang) * 24 * s + hover, 3 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (name === 'Render') {
    const pulse = 0.6 + Math.sin(t * 0.05) * 0.25;
    const stack = [[0, 46], [-62, 30], [-104, 20]];
    stack.forEach(([oy, r]) => {
      ctx.fillStyle = '#d99a2b';
      ctx.beginPath();
      ctx.moveTo(cx, cy + (oy - r * 1.4) * s);
      ctx.lineTo(cx + r * s, cy + oy * s);
      ctx.lineTo(cx, cy + (oy + r * 1.4) * s);
      ctx.lineTo(cx - r * s, cy + oy * s);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#8a5e10';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,232,160,' + (0.25 * pulse) + ')';
      ctx.beginPath();
      ctx.moveTo(cx, cy + (oy - r * 0.8) * s);
      ctx.lineTo(cx + r * 0.55 * s, cy + oy * s);
      ctx.lineTo(cx, cy + (oy + r * 0.8) * s);
      ctx.lineTo(cx - r * 0.55 * s, cy + oy * s);
      ctx.closePath();
      ctx.fill();
    });
    const glow = ctx.createRadialGradient(cx, cy - 62 * s, 2, cx, cy - 62 * s, 40 * s);
    glow.addColorStop(0, `rgba(255,210,127,${0.55 * pulse})`);
    glow.addColorStop(1, 'rgba(255,210,127,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy - 62 * s, 40 * s, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Threshold — a stone gate with a void inside
    ctx.fillStyle = '#0b4d50';
    ctx.fillRect(cx - 58 * s, cy - 124 * s, 22 * s, 124 * s);
    ctx.fillRect(cx + 36 * s, cy - 124 * s, 22 * s, 124 * s);
    ctx.fillRect(cx - 70 * s, cy - 140 * s, 140 * s, 22 * s);
    ctx.strokeStyle = '#063336';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 58 * s, cy - 124 * s, 22 * s, 124 * s);
    ctx.strokeRect(cx + 36 * s, cy - 124 * s, 22 * s, 124 * s);
    ctx.strokeRect(cx - 70 * s, cy - 140 * s, 140 * s, 22 * s);
    const voidGrad = ctx.createLinearGradient(0, cy - 118 * s, 0, cy);
    voidGrad.addColorStop(0, '#02090a');
    voidGrad.addColorStop(1, '#0e5e60');
    ctx.fillStyle = voidGrad;
    ctx.fillRect(cx - 36 * s, cy - 118 * s, 72 * s, 118 * s);
    const runePulse = 0.4 + Math.sin(t * 0.06) * 0.3;
    ctx.strokeStyle = `rgba(127,212,212,${runePulse})`;
    ctx.lineWidth = 2;
    [[-47, -100], [-47, -60], [-47, -20], [47, -100], [47, -60], [47, -20]].forEach(([ox, oy]) => {
      ctx.beginPath();
      ctx.moveTo(cx + (ox - 4) * s, cy + oy * s);
      ctx.lineTo(cx + (ox + 4) * s, cy + (oy + 4) * s);
      ctx.lineTo(cx + (ox - 2) * s, cy + (oy + 8) * s);
      ctx.stroke();
    });
  }
  ctx.restore();
}

function drawEnvoyScene() {
  drawNightScene(0.15);
  if (!currentEnvoy) return;
  drawEnvoyFigure(currentEnvoy.name, 400, 430, 1);
}

function drawFinalBossScene() {
  drawNightScene(0.15);
  if (!finalBossData) return;
  ctx.save();
  if (finalBossData.type === 'envoy') {
    drawEnvoyFigure(finalBossData.name, 400, 460, 1.3);
  } else if (finalBossData.type === 'lonewolf') {
    const cx = 400, cy = 400;
    ctx.fillStyle = '#08060c';
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) {
      const ang = (i / 24) * Math.PI * 2;
      const r = 110 + Math.sin(ang * 3 + frameCount * 0.04) * 12;
      const px = cx + Math.cos(ang) * r;
      const py = cy + Math.sin(ang) * r * 0.75;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#26202e';
    ctx.lineWidth = 2;
    ctx.stroke();
    const blink = Math.sin(frameCount * 0.02) > -0.9 ? 1 : 0.1;
    ctx.fillStyle = `rgba(255,60,60,${0.85 * blink})`;
    ctx.beginPath();
    ctx.ellipse(cx - 28, cy - 20, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 28, cy - 20, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (finalBossData.type === 'betrayal') {
    ctx.fillStyle = 'rgba(139,0,0,0.15)';
    ctx.fillRect(0, 0, 800, 600);
    const spr = ASSETS.chars.champion;
    [-130, 0, 130].forEach((dx, i) => {
      const bob = Math.sin(frameCount * 0.05 + i * 2) * 4;
      ctx.drawImage(spr, 400 + dx - spr.width * 1.5, 330 + bob, spr.width * 3, spr.height * 3);
    });
  }
  ctx.restore();
}

// ===================== MAIN LOOP =====================
function update(dtMs, ndt) {
  frameCount += ndt;
  updateFloatingNumbers(ndt);
  updateAttackFX(ndt);
  updateAmbientParticles(ndt);
  shakeMag = Math.max(0, shakeMag - 0.3 * ndt);
  clampPlayer();

  if (gameState === 'NIGHT_INTRO') updateNightIntro(dtMs);
  else if (gameState === 'NIGHT') updateNight(ndt);
  else if (gameState === 'DODGE') updateDodge(dtMs, ndt);

  updateTouchControlsVisibility();
}

function draw() {
  ctx.clearRect(0, 0, 800, 600);
  const bgGrad = ctx.createLinearGradient(0, 0, 0, 600);
  bgGrad.addColorStop(0, '#0e0e1a');
  bgGrad.addColorStop(1, '#08080c');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 800, 600);

  if (gameState !== 'NIGHT_INTRO') {
    drawStars();
    drawMoon();
  }
  drawAmbientParticles();

  if (gameState === 'NIGHT_INTRO') drawNightIntro();
  else if (gameState === 'NIGHT') drawNightScene(1);
  else if (gameState === 'DODGE') { drawNightScene(0.2); drawDodgeBox(); }
  else if (gameState === 'CHOICE') drawNightScene(0.35);
  else if (gameState === 'DAY') drawNightScene(0.35);
  else if (gameState === 'ENVOY') drawEnvoyScene();
  else if (gameState === 'FINALBOSS_INTRO') drawFinalBossScene();

  drawVignette();
}

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = timestamp - lastTime;
  lastTime = timestamp;
  dt = Math.min(dt, 50);
  const ndt = dt / 16.6667;

  update(dt, ndt);
  draw();

  requestAnimationFrame(gameLoop);
}

setGameState('MENU');
requestAnimationFrame(gameLoop);
</script>
